environment_mapping:
  Production: PRD
  production: PRD
  Prod: PRD
  prod: PRD
  PRD: PRD
  prd: PRD
  QA/Test: QA
  QA: QA
  qa/test: QA
  qa: QA
  Test: QA
  test: QA
  Development: DEV
  Dev: DEV
  development: DEV
  dev: DEV

template:
  worksheet_name: ObjectAccess
  required_columns:
    - Object Type
    - Activity
    - Catalog Name
    - Schema Name
    - Object Name
    - Folder Path
    - Privileges
  allowed_object_types:
    - catalog
    - schema
    - view
    - folder
  allowed_activities:
    - ADD
    - REMOVE
  folder_permission_levels:
    - CAN_READ
    - CAN_RUN
    - CAN_EDIT
    - CAN_MANAGE
  max_records: 1000
