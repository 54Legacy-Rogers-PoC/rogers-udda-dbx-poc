version: 1

# Canonical Key Vault secret names and accepted fallback aliases.
# Values match the current GitHub workflow secret lookup behavior.
secrets:
  databricks_host:
    required: true
    primary: DATABRICKS-HOST
    aliases:
      - DATABRICKS_HOST

  databricks_client_id:
    required: true
    primary: DB-CLIENT-ID
    aliases:
      - DATABRICKS-CLIENT-ID
      - DATABRICKS-CLIENTID
      - DATABRICKS_CLIENT_ID

  databricks_client_secret:
    required: true
    primary: DB-CLIENT-SECRET
    aliases:
      - DATABRICKS-CLIENT-SECRET
      - DATABRICKS-CLIENTSECRET
      - DATABRICKS_CLIENT_SECRET

  databricks_tenant_id:
    required: true
    primary: DB-TENANT-ID
    aliases:
      - DATABRICKS-TENANT-ID
      - DATABRICKS-TENANTID
      - DATABRICKS_TENANT_ID

  databricks_workspace_resource_id:
    required: true
    primary: DATABRICKS-WORKSPACE-RESOURCE-ID
    aliases:
      - DATABRICKS_WORKSPACE_RESOURCE_ID

  tfstate_resource_group:
    required: true
    primary: TFSTATE-RESOURCE-GROUP
    aliases:
      - TFSTATE_RESOURCE_GROUP

  tfstate_storage_account:
    required: true
    primary: TFSTATE-STORAGE-ACCOUNT
    aliases:
      - TFSTATE_STORAGE_ACCOUNT

  tfstate_container:
    required: true
    primary: TFSTATE-CONTAINER-DBX-UDA
    aliases: []

  tfstate_key:
    required: true
    primary: TFSTATE-KEY-DBX
    aliases: []

  tfstate_access_key:
    required: true
    primary: TFSTATE-STORAGE-ACCESS-KEY
    aliases:
      - TFSTATE-ACCESS-KEY
      - TFSTATE_ACCESS_KEY
      - TFSTATE-STORAGE-KEY
      - STORAGE-ACCOUNT-KEY

  notify_smtp_server:
    required: true
    primary: NOTIFY-SMTP-SERVER
    aliases: []

  notify_smtp_port:
    required: true
    primary: NOTIFY-SMTP-PORT
    aliases: []

  notify_smtp_username:
    required: true
    primary: NOTIFY-SMTP-USERNAME
    aliases: []

  notify_smtp_password:
    required: true
    primary: NOTIFY-SMTP-PASSWORD
    aliases: []

  notify_from_email:
    required: true
    primary: NOTIFY-FROM-EMAIL
    aliases: []

  notify_dl_email:
    required: true
    primary: NOTIFY-DL-EMAIL
    aliases: []
