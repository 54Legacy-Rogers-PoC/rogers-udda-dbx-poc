name: UDA Databricks Service Account

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: Path to the Request-as-Code YAML
        required: true
        default: uda/requests/service-account/dev/RITMDEVSA0001.yaml
        type: string
      auto_apply:
        description: Run terraform apply after successful plan
        required: true
        default: false
        type: boolean
      cm_writeback_mode:
        description: CM writeback invocation mode (mock or snowflake)
        required: true
        default: mock
        type: choice
        options:
          - mock
          - snowflake
  push:
    branches:
      - main
    paths:
      - uda/requests/service-account/**
      - uda/scripts/process_service_account_request.py
      - uda/scripts/invoke_cm_writeback.py
      - uda/scripts/manage_cluster_service_account_access.py
      - uda/config/**
      - terraform/**
      - .github/workflows/uda-dbx-service-account.yml

permissions:
  contents: read
  id-token: write

jobs:
  validate_request:
    name: Stage 1-2 Request Validation
    runs-on: ubuntu-latest
    outputs:
      request_id: ${{ steps.read_metadata.outputs.request_id }}
      environment: ${{ steps.read_metadata.outputs.environment }}
      activity_type: ${{ steps.read_metadata.outputs.activity_type }}
      service_account_name: ${{ steps.read_metadata.outputs.service_account_name }}
      service_account_owner: ${{ steps.read_metadata.outputs.service_account_owner }}
      cluster_name: ${{ steps.read_metadata.outputs.cluster_name }}
      cluster_id: ${{ steps.read_metadata.outputs.cluster_id }}
      cluster_permission_level: ${{ steps.read_metadata.outputs.cluster_permission_level }}
      requires_terraform: ${{ steps.read_metadata.outputs.requires_terraform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r uda/scripts/requirements.txt

      - name: Process service account request artifact
        run: |
          python uda/scripts/process_service_account_request.py \
            --request-file "${{ github.event.inputs.request_file || 'uda/requests/service-account/dev/RITMDEVSA0001.yaml' }}" \
            --config-file "uda/config/environments.yaml" \
            --output-dir "generated"

      - name: Read request metadata
        id: read_metadata
        run: |
          echo "request_id=$(jq -r .request_id generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "environment=$(jq -r .environment generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "activity_type=$(jq -r .activity_type generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "service_account_name=$(jq -r .service_account_name generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "service_account_owner=$(jq -r .service_account_owner generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$(jq -r .cluster_name generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "cluster_id=$(jq -r .cluster_id generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "cluster_permission_level=$(jq -r .cluster_permission_level generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "requires_terraform=$(jq -r .requires_terraform generated/request_metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uda-service-account-generated
          path: |
            generated/terraform.auto.tfvars.json
            generated/request_metadata.json
            generated/governance_payload.json
            generated/execution_log.json

  terraform_plan:
    name: Stage 3 Terraform Plan
    runs-on: ubuntu-latest
    needs:
      - validate_request
    if: ${{ needs.validate_request.outputs.requires_terraform == 'true' && needs.validate_request.outputs.activity_type == 'ADD_TO_CLUSTER' }}
    outputs:
      tf_plan_status: ${{ steps.plan_status.outputs.tf_plan_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-service-account-generated
          path: generated

      - name: Validate Azure auth secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          [ -n "$AZURE_CLIENT_ID" ] || { echo "ERROR: Missing secret AZURE_CLIENT_ID"; exit 1; }
          [ -n "$AZURE_CLIENT_SECRET" ] || { echo "ERROR: Missing secret AZURE_CLIENT_SECRET"; exit 1; }
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || { echo "ERROR: Missing secret AZURE_SUBSCRIPTION_ID"; exit 1; }
          [ -n "$AZURE_TENANT_ID" ] || { echo "ERROR: Missing secret AZURE_TENANT_ID"; exit 1; }

          guid_regex='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          [[ "$AZURE_CLIENT_ID" =~ $guid_regex ]] || { echo "ERROR: AZURE_CLIENT_ID must be a GUID Application (client) ID."; exit 1; }
          [[ "$AZURE_TENANT_ID" =~ $guid_regex ]] || { echo "ERROR: AZURE_TENANT_ID must be a GUID Directory (tenant) ID."; exit 1; }
          [[ "$AZURE_SUBSCRIPTION_ID" =~ $guid_regex ]] || { echo "ERROR: AZURE_SUBSCRIPTION_ID must be a GUID subscription ID."; exit 1; }

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Load Databricks and Terraform backend secrets from Azure Key Vault
        env:
          KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$KEYVAULT_NAME" ]; then
            echo "ERROR: KEYVAULT_NAME secret is missing."
            exit 1
          fi

          get_kv_secret() {
            local logical_name="$1"
            shift
            local candidate value
            for candidate in "$@"; do
              if value=$(az keyvault secret show --vault-name "$KEYVAULT_NAME" --name "$candidate" --query value -o tsv 2>/dev/null); then
                if [ -n "$value" ]; then
                  echo "$value"
                  return 0
                fi
              fi
            done
            echo "ERROR: Secret not found for $logical_name. Tried: $*" >&2
            return 1
          }

          try_kv_secret() {
            local candidate value
            for candidate in "$@"; do
              if value=$(az keyvault secret show --vault-name "$KEYVAULT_NAME" --name "$candidate" --query value -o tsv 2>/dev/null); then
                if [ -n "$value" ]; then
                  echo "$value"
                  return 0
                fi
              fi
            done
            return 1
          }

          DBX_HOST=$(get_kv_secret "Databricks host" DATABRICKS-HOST DATABRICKS_HOST)
          DBX_CLIENT_ID=$(try_kv_secret DATABRICKS-CLIENT-ID DATABRICKS-CLIENTID DATABRICKS_CLIENT_ID || true)
          DBX_CLIENT_SECRET=$(try_kv_secret DATABRICKS-CLIENT-SECRET DATABRICKS-CLIENTSECRET DATABRICKS_CLIENT_SECRET || true)
          DBX_TENANT_ID=$(try_kv_secret DATABRICKS-TENANT-ID DATABRICKS-TENANTID DATABRICKS_TENANT_ID || true)
          DBX_WORKSPACE_RESOURCE_ID=$(try_kv_secret DATABRICKS-WORKSPACE-RESOURCE-ID DATABRICKS_WORKSPACE_RESOURCE_ID || true)

          DBX_CLIENT_ID="${DBX_CLIENT_ID:-$AZURE_CLIENT_ID}"
          DBX_CLIENT_SECRET="${DBX_CLIENT_SECRET:-$AZURE_CLIENT_SECRET}"
          DBX_TENANT_ID="${DBX_TENANT_ID:-$AZURE_TENANT_ID}"

          [ -n "$DBX_CLIENT_ID" ] || { echo "ERROR: Databricks client id not found in KV and AZURE_CLIENT_ID is empty."; exit 1; }
          [ -n "$DBX_CLIENT_SECRET" ] || { echo "ERROR: Databricks client secret not found in KV and AZURE_CLIENT_SECRET is empty."; exit 1; }
          [ -n "$DBX_TENANT_ID" ] || { echo "ERROR: Databricks tenant id not found in KV and AZURE_TENANT_ID is empty."; exit 1; }
          [ -n "$DBX_WORKSPACE_RESOURCE_ID" ] || { echo "ERROR: DATABRICKS-WORKSPACE-RESOURCE-ID is required for Azure SP auth."; exit 1; }

          echo "TF_VAR_databricks_host=$DBX_HOST" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_id=$DBX_CLIENT_ID" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_secret=$DBX_CLIENT_SECRET" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_tenant_id=$DBX_TENANT_ID" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_workspace_resource_id=$DBX_WORKSPACE_RESOURCE_ID" >> "$GITHUB_ENV"

          TFSTATE_RG=$(get_kv_secret "TF state resource group" TFSTATE-RESOURCE-GROUP TFSTATE_RESOURCE_GROUP)
          TFSTATE_SA=$(get_kv_secret "TF state storage account" TFSTATE-STORAGE-ACCOUNT TFSTATE_STORAGE_ACCOUNT)
          TFSTATE_CONTAINER=$(get_kv_secret "TF state container" TFSTATE-CONTAINER-DBX-UDA)
          TFSTATE_KEY=$(get_kv_secret "TF state key" TFSTATE-KEY-DBX)
          TFSTATE_ACCESS_KEY=$(try_kv_secret TFSTATE-ACCESS-KEY TFSTATE_ACCESS_KEY || true)

          echo "TFSTATE_RESOURCE_GROUP=$TFSTATE_RG" >> "$GITHUB_ENV"
          echo "TFSTATE_STORAGE_ACCOUNT=$TFSTATE_SA" >> "$GITHUB_ENV"
          echo "TFSTATE_CONTAINER=$TFSTATE_CONTAINER" >> "$GITHUB_ENV"
          echo "TFSTATE_KEY=$TFSTATE_KEY" >> "$GITHUB_ENV"
          echo "TFSTATE_ACCESS_KEY=$TFSTATE_ACCESS_KEY" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: |
          set -euo pipefail
          if [ -n "${TFSTATE_ACCESS_KEY:-}" ]; then
            terraform init \
              -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
              -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
              -backend-config="container_name=$TFSTATE_CONTAINER" \
              -backend-config="key=$TFSTATE_KEY" \
              -backend-config="access_key=$TFSTATE_ACCESS_KEY"
          else
            terraform init \
              -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
              -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
              -backend-config="container_name=$TFSTATE_CONTAINER" \
              -backend-config="key=$TFSTATE_KEY" \
              -backend-config="use_azuread_auth=true"
          fi

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var-file="../generated/terraform.auto.tfvars.json" \
            -out="tfplan.binary"
          terraform show -no-color tfplan.binary > tfplan.txt

      - name: Set plan status
        id: plan_status
        run: echo "tf_plan_status=success" >> "$GITHUB_OUTPUT"

      - name: Upload terraform plan output
        uses: actions/upload-artifact@v4
        with:
          name: uda-service-account-terraform-plan
          path: |
            terraform/tfplan.binary
            terraform/tfplan.txt

  terraform_apply:
    name: Stage 4 Terraform Apply
    runs-on: ubuntu-latest
    needs:
      - validate_request
      - terraform_plan
    if: ${{ needs.validate_request.outputs.requires_terraform == 'true' && needs.validate_request.outputs.activity_type == 'ADD_TO_CLUSTER' && (github.event_name == 'push' || github.event.inputs.auto_apply == 'true') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-service-account-generated
          path: generated

      - name: Download terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          name: uda-service-account-terraform-plan
          path: terraform

      - name: Validate Azure auth secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          [ -n "$AZURE_CLIENT_ID" ] || { echo "ERROR: Missing secret AZURE_CLIENT_ID"; exit 1; }
          [ -n "$AZURE_CLIENT_SECRET" ] || { echo "ERROR: Missing secret AZURE_CLIENT_SECRET"; exit 1; }
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || { echo "ERROR: Missing secret AZURE_SUBSCRIPTION_ID"; exit 1; }
          [ -n "$AZURE_TENANT_ID" ] || { echo "ERROR: Missing secret AZURE_TENANT_ID"; exit 1; }

          guid_regex='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          [[ "$AZURE_CLIENT_ID" =~ $guid_regex ]] || { echo "ERROR: AZURE_CLIENT_ID must be a GUID Application (client) ID."; exit 1; }
          [[ "$AZURE_TENANT_ID" =~ $guid_regex ]] || { echo "ERROR: AZURE_TENANT_ID must be a GUID Directory (tenant) ID."; exit 1; }
          [[ "$AZURE_SUBSCRIPTION_ID" =~ $guid_regex ]] || { echo "ERROR: AZURE_SUBSCRIPTION_ID must be a GUID subscription ID."; exit 1; }

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Load Databricks and Terraform backend secrets from Azure Key Vault
        env:
          KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$KEYVAULT_NAME" ]; then
            echo "ERROR: KEYVAULT_NAME secret is missing."
            exit 1
          fi

          get_kv_secret() {
            local logical_name="$1"
            shift
            local candidate value
            for candidate in "$@"; do
              if value=$(az keyvault secret show --vault-name "$KEYVAULT_NAME" --name "$candidate" --query value -o tsv 2>/dev/null); then
                if [ -n "$value" ]; then
                  echo "$value"
                  return 0
                fi
              fi
            done
            echo "ERROR: Secret not found for $logical_name. Tried: $*" >&2
            return 1
          }

          try_kv_secret() {
            local candidate value
            for candidate in "$@"; do
              if value=$(az keyvault secret show --vault-name "$KEYVAULT_NAME" --name "$candidate" --query value -o tsv 2>/dev/null); then
                if [ -n "$value" ]; then
                  echo "$value"
                  return 0
                fi
              fi
            done
            return 1
          }

          DBX_HOST=$(get_kv_secret "Databricks host" DATABRICKS-HOST DATABRICKS_HOST)
          DBX_CLIENT_ID=$(try_kv_secret DATABRICKS-CLIENT-ID DATABRICKS-CLIENTID DATABRICKS_CLIENT_ID || true)
          DBX_CLIENT_SECRET=$(try_kv_secret DATABRICKS-CLIENT-SECRET DATABRICKS-CLIENTSECRET DATABRICKS_CLIENT_SECRET || true)
          DBX_TENANT_ID=$(try_kv_secret DATABRICKS-TENANT-ID DATABRICKS-TENANTID DATABRICKS_TENANT_ID || true)
          DBX_WORKSPACE_RESOURCE_ID=$(try_kv_secret DATABRICKS-WORKSPACE-RESOURCE-ID DATABRICKS_WORKSPACE_RESOURCE_ID || true)

          DBX_CLIENT_ID="${DBX_CLIENT_ID:-$AZURE_CLIENT_ID}"
          DBX_CLIENT_SECRET="${DBX_CLIENT_SECRET:-$AZURE_CLIENT_SECRET}"
          DBX_TENANT_ID="${DBX_TENANT_ID:-$AZURE_TENANT_ID}"

          [ -n "$DBX_CLIENT_ID" ] || { echo "ERROR: Databricks client id not found in KV and AZURE_CLIENT_ID is empty."; exit 1; }
          [ -n "$DBX_CLIENT_SECRET" ] || { echo "ERROR: Databricks client secret not found in KV and AZURE_CLIENT_SECRET is empty."; exit 1; }
          [ -n "$DBX_TENANT_ID" ] || { echo "ERROR: Databricks tenant id not found in KV and AZURE_TENANT_ID is empty."; exit 1; }
          [ -n "$DBX_WORKSPACE_RESOURCE_ID" ] || { echo "ERROR: DATABRICKS-WORKSPACE-RESOURCE-ID is required for Azure SP auth."; exit 1; }

          echo "TF_VAR_databricks_host=$DBX_HOST" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_id=$DBX_CLIENT_ID" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_secret=$DBX_CLIENT_SECRET" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_tenant_id=$DBX_TENANT_ID" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_workspace_resource_id=$DBX_WORKSPACE_RESOURCE_ID" >> "$GITHUB_ENV"

          TFSTATE_RG=$(get_kv_secret "TF state resource group" TFSTATE-RESOURCE-GROUP TFSTATE_RESOURCE_GROUP)
          TFSTATE_SA=$(get_kv_secret "TF state storage account" TFSTATE-STORAGE-ACCOUNT TFSTATE_STORAGE_ACCOUNT)
          TFSTATE_CONTAINER=$(get_kv_secret "TF state container" TFSTATE-CONTAINER-DBX-UDA)
          TFSTATE_KEY=$(get_kv_secret "TF state key" TFSTATE-KEY-DBX)
          TFSTATE_ACCESS_KEY=$(try_kv_secret TFSTATE-ACCESS-KEY TFSTATE_ACCESS_KEY || true)

          echo "TFSTATE_RESOURCE_GROUP=$TFSTATE_RG" >> "$GITHUB_ENV"
          echo "TFSTATE_STORAGE_ACCOUNT=$TFSTATE_SA" >> "$GITHUB_ENV"
          echo "TFSTATE_CONTAINER=$TFSTATE_CONTAINER" >> "$GITHUB_ENV"
          echo "TFSTATE_KEY=$TFSTATE_KEY" >> "$GITHUB_ENV"
          echo "TFSTATE_ACCESS_KEY=$TFSTATE_ACCESS_KEY" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: |
          set -euo pipefail
          if [ -n "${TFSTATE_ACCESS_KEY:-}" ]; then
            terraform init \
              -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
              -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
              -backend-config="container_name=$TFSTATE_CONTAINER" \
              -backend-config="key=$TFSTATE_KEY" \
              -backend-config="access_key=$TFSTATE_ACCESS_KEY"
          else
            terraform init \
              -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
              -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
              -backend-config="container_name=$TFSTATE_CONTAINER" \
              -backend-config="key=$TFSTATE_KEY" \
              -backend-config="use_azuread_auth=true"
          fi

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan.binary

  cluster_access_remove:
    name: Stage 4 Cluster Access Remove
    runs-on: ubuntu-latest
    needs:
      - validate_request
    if: ${{ needs.validate_request.outputs.requires_terraform == 'true' && needs.validate_request.outputs.activity_type == 'REMOVE_FROM_CLUSTER' }}
    outputs:
      cluster_remove_status: ${{ steps.read_status.outputs.cluster_remove_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Azure auth secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          [ -n "$AZURE_CLIENT_ID" ] || { echo "ERROR: Missing secret AZURE_CLIENT_ID"; exit 1; }
          [ -n "$AZURE_CLIENT_SECRET" ] || { echo "ERROR: Missing secret AZURE_CLIENT_SECRET"; exit 1; }
          [ -n "$AZURE_TENANT_ID" ] || { echo "ERROR: Missing secret AZURE_TENANT_ID"; exit 1; }

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Load Databricks provider secrets from Azure Key Vault
        env:
          KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$KEYVAULT_NAME" ]; then
            echo "ERROR: KEYVAULT_NAME secret is missing."
            exit 1
          fi

          get_kv_secret() {
            local logical_name="$1"
            shift
            local candidate value
            for candidate in "$@"; do
              if value=$(az keyvault secret show --vault-name "$KEYVAULT_NAME" --name "$candidate" --query value -o tsv 2>/dev/null); then
                if [ -n "$value" ]; then
                  echo "$value"
                  return 0
                fi
              fi
            done
            echo "ERROR: Secret not found for $logical_name. Tried: $*" >&2
            return 1
          }

          try_kv_secret() {
            local candidate value
            for candidate in "$@"; do
              if value=$(az keyvault secret show --vault-name "$KEYVAULT_NAME" --name "$candidate" --query value -o tsv 2>/dev/null); then
                if [ -n "$value" ]; then
                  echo "$value"
                  return 0
                fi
              fi
            done
            return 1
          }

          DBX_HOST=$(get_kv_secret "Databricks host" DATABRICKS-HOST DATABRICKS_HOST)
          DBX_CLIENT_ID=$(try_kv_secret DATABRICKS-CLIENT-ID DATABRICKS-CLIENTID DATABRICKS_CLIENT_ID || true)
          DBX_CLIENT_SECRET=$(try_kv_secret DATABRICKS-CLIENT-SECRET DATABRICKS-CLIENTSECRET DATABRICKS_CLIENT_SECRET || true)
          DBX_TENANT_ID=$(try_kv_secret DATABRICKS-TENANT-ID DATABRICKS-TENANTID DATABRICKS_TENANT_ID || true)

          DBX_CLIENT_ID="${DBX_CLIENT_ID:-$AZURE_CLIENT_ID}"
          DBX_CLIENT_SECRET="${DBX_CLIENT_SECRET:-$AZURE_CLIENT_SECRET}"
          DBX_TENANT_ID="${DBX_TENANT_ID:-$AZURE_TENANT_ID}"

          [ -n "$DBX_CLIENT_ID" ] || { echo "ERROR: Databricks client id not found in KV and AZURE_CLIENT_ID is empty."; exit 1; }
          [ -n "$DBX_CLIENT_SECRET" ] || { echo "ERROR: Databricks client secret not found in KV and AZURE_CLIENT_SECRET is empty."; exit 1; }
          [ -n "$DBX_TENANT_ID" ] || { echo "ERROR: Databricks tenant id not found in KV and AZURE_TENANT_ID is empty."; exit 1; }

          echo "DBX_HOST=$DBX_HOST" >> "$GITHUB_ENV"
          echo "DBX_CLIENT_ID=$DBX_CLIENT_ID" >> "$GITHUB_ENV"
          echo "DBX_CLIENT_SECRET=$DBX_CLIENT_SECRET" >> "$GITHUB_ENV"
          echo "DBX_TENANT_ID=$DBX_TENANT_ID" >> "$GITHUB_ENV"

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-service-account-generated
          path: generated

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Remove cluster access while preserving existing ACL entries
        run: |
          python uda/scripts/manage_cluster_service_account_access.py \
            --host "$DBX_HOST" \
            --tenant-id "$DBX_TENANT_ID" \
            --client-id "$DBX_CLIENT_ID" \
            --client-secret "$DBX_CLIENT_SECRET" \
            --activity "${{ needs.validate_request.outputs.activity_type }}" \
            --service-account-name "${{ needs.validate_request.outputs.service_account_name }}" \
            --cluster-id "${{ needs.validate_request.outputs.cluster_id }}" \
            --cluster-name "${{ needs.validate_request.outputs.cluster_name }}" \
            --permission-level "${{ needs.validate_request.outputs.cluster_permission_level }}" \
            --status-file generated/cluster_access_status.json

      - name: Read cluster remove status
        id: read_status
        run: |
          echo "cluster_remove_status=$(jq -r .status generated/cluster_access_status.json)" >> "$GITHUB_OUTPUT"

      - name: Upload cluster access status artifact
        uses: actions/upload-artifact@v4
        with:
          name: uda-service-account-cluster-access-status
          path: generated/cluster_access_status.json

  metadata_only:
    name: Stage 3 Metadata-Only Path
    runs-on: ubuntu-latest
    needs:
      - validate_request
    if: ${{ needs.validate_request.outputs.requires_terraform != 'true' }}
    outputs:
      tf_plan_status: ${{ steps.status.outputs.tf_plan_status }}
    steps:
      - name: Mark metadata-only request
        id: status
        run: echo "tf_plan_status=not_required" >> "$GITHUB_OUTPUT"

  cm_writeback:
    name: Stage 4 CM Writeback
    runs-on: ubuntu-latest
    needs:
      - validate_request
      - terraform_plan
      - terraform_apply
      - cluster_access_remove
      - metadata_only
    if: ${{ needs.validate_request.result == 'success' && (needs.validate_request.outputs.requires_terraform != 'true' || needs.terraform_apply.result == 'success' || needs.cluster_access_remove.result == 'success') }}
    outputs:
      cm_writeback_status: ${{ steps.read_cm_status.outputs.cm_writeback_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r uda/scripts/requirements.txt
          if [ "${{ github.event.inputs.cm_writeback_mode || 'mock' }}" = "snowflake" ]; then
            pip install snowflake-connector-python
          fi

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-service-account-generated
          path: generated

      - name: Invoke CM stored procedure
        env:
          CM_WRITEBACK_MODE: ${{ github.event.inputs.cm_writeback_mode || 'mock' }}
          CM_SNOWFLAKE_ACCOUNT: ${{ secrets.CM_SNOWFLAKE_ACCOUNT }}
          CM_SNOWFLAKE_USER: ${{ secrets.CM_SNOWFLAKE_USER }}
          CM_SNOWFLAKE_PASSWORD: ${{ secrets.CM_SNOWFLAKE_PASSWORD }}
          CM_SNOWFLAKE_WAREHOUSE: ${{ secrets.CM_SNOWFLAKE_WAREHOUSE }}
          CM_SNOWFLAKE_ROLE: ${{ secrets.CM_SNOWFLAKE_ROLE }}
          METADATA_DATABASE: ${{ secrets.METADATA_DATABASE }}
          METADATA_SCHEMA: ${{ secrets.METADATA_SCHEMA }}
          METADATA_STORED_PROCEDURE: ${{ secrets.METADATA_STORED_PROCEDURE }}
        run: |
          python uda/scripts/invoke_cm_writeback.py \
            --payload-file generated/governance_payload.json \
            --status-file generated/cm_writeback_status.json \
            --mode "${CM_WRITEBACK_MODE}"

      - name: Read CM status
        id: read_cm_status
        run: |
          echo "cm_writeback_status=$(jq -r .cm_writeback_status generated/cm_writeback_status.json)" >> "$GITHUB_OUTPUT"

      - name: Upload CM status artifact
        uses: actions/upload-artifact@v4
        with:
          name: uda-service-account-cm-status
          path: generated/cm_writeback_status.json

  notification:
    name: Stage 5 Notification and Summary
    runs-on: ubuntu-latest
    needs:
      - validate_request
      - terraform_plan
      - terraform_apply
      - cluster_access_remove
      - metadata_only
      - cm_writeback
    if: always()
    steps:
      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-service-account-generated
          path: generated

      - name: Publish workflow summary
        run: |
          {
            echo "## Databricks Service Account Execution Summary"
            echo ""
            echo "- Request ID: ${{ needs.validate_request.outputs.request_id }}"
            echo "- Service Account Name: ${{ needs.validate_request.outputs.service_account_name }}"
            echo "- Service Account Owner: ${{ needs.validate_request.outputs.service_account_owner }}"
            echo "- Environment: ${{ needs.validate_request.outputs.environment }}"
            echo "- Activity Type: ${{ needs.validate_request.outputs.activity_type }}"
            echo "- Cluster Name: ${{ needs.validate_request.outputs.cluster_name }}"
            echo "- Terraform Required: ${{ needs.validate_request.outputs.requires_terraform }}"
            echo "- Terraform Plan Status: ${{ needs.terraform_plan.outputs.tf_plan_status || needs.metadata_only.outputs.tf_plan_status }}"
            echo "- Cluster Remove Status: ${{ needs.cluster_access_remove.outputs.cluster_remove_status || 'not_run' }}"
            echo "- CM Writeback Status: ${{ needs.cm_writeback.outputs.cm_writeback_status || 'not_run' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Archive execution log
        uses: actions/upload-artifact@v4
        with:
          name: uda-service-account-execution-log
          path: generated/execution_log.json
