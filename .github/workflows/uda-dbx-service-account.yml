name: UDA Databricks Service Account

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: Path to the Request-as-Code YAML
        required: true
        default: requests/service-account/dev/RITMDEVSA0001.yaml
        type: string
      auto_apply:
        description: Run terraform apply after successful plan
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - requests/service-account/**
      - uda/scripts/service-account/process_service_account_request.py
      - uda/scripts/service-account/invoke_cm_writeback.py
      - uda/config/**
      - terraform/environment/**
      - .github/workflows/uda-dbx-service-account.yml

permissions:
  contents: read
  id-token: write

jobs:
  service_account_request:
    uses: 54Legacy-Rogers-PoC/54legacy-Resusable-Workflows/.github/workflows/solutions-dbx-udaa-request.yml@main
    with:
      request-file: ${{ inputs.request_file || 'requests/service-account/dev/RITMDEVSA0001.yaml' }}
      apply: ${{ inputs.auto_apply || false }}
    secrets: inherit
