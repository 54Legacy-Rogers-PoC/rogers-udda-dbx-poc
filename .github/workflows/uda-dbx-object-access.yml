name: UDA Databricks Object Access

on:
  push:
    branches:
      - "**"
    paths:
      - "uda/attachments/object-access/**"
  pull_request:
    branches:
      - "**"
    paths:
      - "uda/attachments/object-access/**"
  workflow_dispatch:
    inputs:
      template_file:
        description: Path to a single Excel template file
        required: false
        default: ""
        type: string
      template_files:
        description: Optional comma or newline separated Excel template paths
        required: false
        default: ""
        type: string
      attachments_dir:
        description: Directory containing template attachments
        required: true
        default: uda/attachments/object-access
        type: string
      output_dir:
        description: Directory to write parsed/tfvars/plan outputs
        required: true
        default: uda/output/object-access
        type: string
      run_plan:
        description: Run Terraform plan stage
        required: true
        default: true
        type: boolean
      run_apply:
        description: Run Terraform apply stage
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: uda-dbx-object-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-templates:
    runs-on: ubuntu-latest
    outputs:
      has_templates: ${{ steps.collect.outputs.has_templates }}
      matrix: ${{ steps.collect.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect template files
        id: collect
        shell: bash
        env:
          TEMPLATE_FILE_INPUT: ${{ inputs.template_file }}
          TEMPLATE_FILES_INPUT: ${{ inputs.template_files }}
          ATTACHMENTS_DIR_INPUT: ${{ inputs.attachments_dir }}
        run: |
          set -euo pipefail

          is_excel() {
            case "${1,,}" in
              *.xlsx|*.xlsm|*.xls) return 0 ;;
              *) return 1 ;;
            esac
          }

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            template_files_raw="${TEMPLATE_FILES_INPUT:-}"
            single_template="${TEMPLATE_FILE_INPUT:-}"
            attachments_dir="${ATTACHMENTS_DIR_INPUT:-uda/attachments/object-access}"

            if [ -n "$template_files_raw" ]; then
              mapfile -t requested_templates < <(printf '%s\n' "$template_files_raw" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | awk '!seen[$0]++')
            elif [ -n "$single_template" ]; then
              requested_templates=("$single_template")
            else
              mapfile -t requested_templates < <(find "$attachments_dir" -maxdepth 1 -type f \( -name '*.xlsx' -o -name '*.xlsm' -o -name '*.xls' \) | sed 's#^./##')
            fi

            if [ "${#requested_templates[@]}" -eq 0 ]; then
              echo "No template files found for workflow_dispatch." >&2
              exit 1
            fi

            valid_templates=()
            for f in "${requested_templates[@]}"; do
              if [ ! -f "$f" ]; then
                echo "Requested template not found: $f" >&2
                exit 1
              fi
              if ! is_excel "$f"; then
                echo "Unsupported template extension (expected .xlsx/.xlsm/.xls): $f" >&2
                exit 1
              fi
              valid_templates+=("$f")
            done

            matrix_json="$(python -c "import json,sys; print(json.dumps({'include':[{'template_file':f} for f in sys.argv[1:] if f]}))" "${valid_templates[@]}")"
            echo "has_templates=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
            if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              base_sha="$(git rev-parse HEAD~1)"
            fi
          fi

          mapfile -t changed_templates < <(git diff --name-only --diff-filter=A "$base_sha" "$head_sha" -- "uda/attachments/object-access/*")

          existing_templates=()
          for f in "${changed_templates[@]}"; do
            if [ -f "$f" ] && is_excel "$f"; then
              existing_templates+=("$f")
            fi
          done

          if [ "${#existing_templates[@]}" -eq 0 ]; then
            echo "has_templates=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix_json="$(python -c "import json,sys; print(json.dumps({'include':[{'template_file':f} for f in sys.argv[1:] if f]}))" "${existing_templates[@]}")"
          echo "has_templates=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  plan-object-access:
    needs: detect-templates
    if: ${{ needs.detect-templates.outputs.has_templates == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_plan) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect-templates.outputs.matrix) }}
    env:
      TEMPLATE_FILE: ${{ matrix.template_file }}
      OUTPUT_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.output_dir || 'uda/output/object-access' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install workflow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml openpyxl xlrd

      - name: Prepare output paths
        id: prep_paths
        shell: bash
        run: |
          template_name="$(basename "$TEMPLATE_FILE")"
          request_id="${template_name%.*}"
          output_dir="$OUTPUT_ROOT/$request_id"
          mkdir -p "$output_dir"
          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"
          echo "PARSED_JSON=$output_dir/parsed-object-access.json" >> "$GITHUB_ENV"
          echo "TFVARS_JSON=$output_dir/object-access.auto.tfvars.json" >> "$GITHUB_ENV"
          echo "TFPLAN_BIN=$output_dir/object-access.tfplan" >> "$GITHUB_ENV"
          echo "TFPLAN_TXT=$output_dir/object-access-plan.txt" >> "$GITHUB_ENV"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Resolve object list worksheet name
        id: resolve_sheet
        shell: bash
        run: |
          SHEET_NAME="$(python - <<'PY'
          import os
          from pathlib import Path
          from openpyxl import load_workbook

          template_path = Path(os.environ["TEMPLATE_FILE"])
          wb = load_workbook(template_path, data_only=True)
          sheetnames = wb.sheetnames

          for candidate in ["ObjectAccess", "Object List"]:
              if candidate in sheetnames:
                  print(candidate)
                  raise SystemExit(0)

          raise SystemExit(
              "Unable to resolve worksheet. Expected one of ['ObjectAccess', 'Object List']. "
              f"Available sheets={sheetnames}"
          )
          PY
          )"
          echo "sheet_name=$SHEET_NAME" >> "$GITHUB_OUTPUT"

      - name: Validate object access template
        run: |
          python uda/scripts/object-access/validate_template.py \
            --template-file "$TEMPLATE_FILE" \
            --sheet-name "${{ steps.resolve_sheet.outputs.sheet_name }}"

      - name: Parse object access template
        run: |
          python uda/scripts/object-access/parse_template.py \
            --template-file "$TEMPLATE_FILE" \
            --sheet-name "${{ steps.resolve_sheet.outputs.sheet_name }}" \
            --output-file "$PARSED_JSON"

      - name: Generate tfvars JSON
        run: |
          python uda/scripts/object-access/generate_tfvars.py \
            --input-json "$PARSED_JSON" \
            --output-json "$TFVARS_JSON"

      - name: Determine request activity from parsed rows
        shell: bash
        run: |
          REQUEST_ACTIVITY="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["TFVARS_JSON"]).read_text(encoding="utf-8"))
          activities = sorted({str(r.get("activity", "")).strip().upper() for r in payload.get("object_access_records", []) if str(r.get("activity", "")).strip()})

          if not activities:
              raise SystemExit("No activity found in parsed template rows")

          normalized = set()
          for a in activities:
              if a == "REVOKE":
                  normalized.add("REMOVE")
              else:
                  normalized.add(a)

          if len(normalized) != 1:
              raise SystemExit(f"Mixed activities are not supported in a single template. Found={sorted(normalized)}")

          print(next(iter(normalized)))
          PY
          )"
          echo "REQUEST_ACTIVITY=$REQUEST_ACTIVITY" >> "$GITHUB_ENV"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Load Databricks secrets from Key Vault
        shell: bash
        run: |
          KV="${{ secrets.KEYVAULT_NAME }}"

          get_kv_secret() {
            local out_var="$1"
            shift
            local names=("$@")
            local value=""
            for secret_name in "${names[@]}"; do
              value="$(az keyvault secret show --vault-name "$KV" --name "$secret_name" --query value -o tsv 2>/dev/null | tr -d '\r' || true)"
              if [ -n "$value" ]; then
                printf -v "$out_var" '%s' "$value"
                return 0
              fi
            done
            echo "Missing Key Vault secret. Tried names: ${names[*]}" >&2
            exit 1
          }

          get_kv_secret DATABRICKS_HOST_RAW DATABRICKS-HOST DB-HOST
          DATABRICKS_HOST_VALUE="$(echo "$DATABRICKS_HOST_RAW" | sed -E 's#^(https://[^/]+).*$#\1#' | sed 's#/$##')"
          get_kv_secret DATABRICKS_CLIENT_ID_VALUE DB-CLIENT-ID DATABRICKS-CLIENT-ID
          get_kv_secret DATABRICKS_CLIENT_SECRET_VALUE DB-CLIENT-SECRET DATABRICKS-CLIENT-SECRET
          get_kv_secret DATABRICKS_TENANT_ID_VALUE DB-TENANT-ID DATABRICKS-TENANT-ID
          get_kv_secret TFSTATE_RESOURCE_GROUP_VALUE TFSTATE-RESOURCE-GROUP TFSTATE-RESOURCE-GROUP-DBX-UDA
          get_kv_secret TFSTATE_STORAGE_ACCOUNT_VALUE TFSTATE-STORAGE-ACCOUNT TFSTATE-STORAGE-ACCOUNT-DBX-UDA
          get_kv_secret TFSTATE_CONTAINER_VALUE TFSTATE-CONTAINER-DBX-UDA TFSTATE-CONTAINER
          get_kv_secret TFSTATE_KEY_PREFIX_VALUE TFSTATE-KEY-PREFIX TFSTATE-KEY-ROOT TFSTATE-KEY-DBX TFSTATE-KEY
          get_kv_secret TFSTATE_ACCESS_KEY_VALUE TFSTATE-STORAGE-ACCESS-KEY TFSTATE-ACCESS-KEY TFSTATE-STORAGE-KEY STORAGE-ACCOUNT-KEY

          readarray -t KEY_PARTS < <(python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          payload = json.loads(Path(os.environ["TFVARS_JSON"]).read_text(encoding="utf-8"))
          records = payload.get("object_access_records", [])

          if not records:
              raise SystemExit("No object_access_records found in tfvars")

          envs = {str(r.get("environment", "")).strip().lower() for r in records if str(r.get("environment", "")).strip()}
          access_types = {str(r.get("access_for", "")).strip().lower() for r in records if str(r.get("access_for", "")).strip()}
          principals = {str(r.get("principal_name", "")).strip().lower() for r in records if str(r.get("principal_name", "")).strip()}

          if len(envs) != 1 or len(access_types) != 1 or len(principals) != 1:
              raise SystemExit(
                  "Expected a single environment/access_for/principal per template. "
                  f"Found env={sorted(envs)}, access_for={sorted(access_types)}, principal={sorted(principals)}"
              )

          def norm(v: str) -> str:
              return re.sub(r"[^a-z0-9]+", "_", v).strip("_") or "unknown"

          print(norm(next(iter(envs))))
          print(norm(next(iter(access_types))))
          print(norm(next(iter(principals))))
          PY
          )

          KEY_ENV="${KEY_PARTS[0]:-unknown}"
          KEY_ACCESS_FOR="${KEY_PARTS[1]:-unknown}"
          KEY_PRINCIPAL="${KEY_PARTS[2]:-unknown}"

          KEY_PREFIX="$TFSTATE_KEY_PREFIX_VALUE"
          if [[ "$KEY_PREFIX" == *.tfstate ]]; then
            KEY_PREFIX="${KEY_PREFIX%/*}"
          fi
          KEY_PREFIX="${KEY_PREFIX%/}"
          if [ -z "$KEY_PREFIX" ]; then
            KEY_PREFIX="databricks/object-access"
          fi

          TFSTATE_KEY_EFFECTIVE="$KEY_PREFIX/$KEY_ENV/$KEY_ACCESS_FOR/$KEY_PRINCIPAL.tfstate"

          for v in DATABRICKS_HOST_VALUE DATABRICKS_CLIENT_ID_VALUE DATABRICKS_CLIENT_SECRET_VALUE DATABRICKS_TENANT_ID_VALUE TFSTATE_RESOURCE_GROUP_VALUE TFSTATE_STORAGE_ACCOUNT_VALUE TFSTATE_CONTAINER_VALUE TFSTATE_KEY_PREFIX_VALUE TFSTATE_ACCESS_KEY_VALUE; do
            if [ -z "${!v}" ]; then
              echo "Missing or empty secret value for $v from Key Vault $KV" >&2
              exit 1
            fi
          done

          echo "::add-mask::$DATABRICKS_CLIENT_SECRET_VALUE"
          echo "::add-mask::$TFSTATE_ACCESS_KEY_VALUE"

          echo "TF_VAR_databricks_host=$DATABRICKS_HOST_VALUE" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_id=$DATABRICKS_CLIENT_ID_VALUE" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_secret=$DATABRICKS_CLIENT_SECRET_VALUE" >> "$GITHUB_ENV"

          echo "TF_BACKEND_RESOURCE_GROUP_NAME=$TFSTATE_RESOURCE_GROUP_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_STORAGE_ACCOUNT_NAME=$TFSTATE_STORAGE_ACCOUNT_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_CONTAINER_NAME=$TFSTATE_CONTAINER_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_KEY=$TFSTATE_KEY_EFFECTIVE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_ACCESS_KEY=$TFSTATE_ACCESS_KEY_VALUE" >> "$GITHUB_ENV"

          echo "DATABRICKS_HOST=$DATABRICKS_HOST_VALUE" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_ID=$DATABRICKS_CLIENT_ID_VALUE" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_SECRET=$DATABRICKS_CLIENT_SECRET_VALUE" >> "$GITHUB_ENV"

          echo "Derived backend key: $TFSTATE_KEY_EFFECTIVE"

      - name: Terraform init (with retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Terraform init attempt $attempt/3"
            if terraform -chdir=terraform init \
              -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP_NAME" \
              -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT_NAME" \
              -backend-config="container_name=$TF_BACKEND_CONTAINER_NAME" \
              -backend-config="key=$TF_BACKEND_KEY" \
              -backend-config="access_key=$TF_BACKEND_ACCESS_KEY"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "terraform init failed after 3 attempts" >&2
          exit 1

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        shell: bash
        run: |
          if [ "$REQUEST_ACTIVITY" = "REMOVE" ]; then
            mapfile -t TARGETS < <(jq -r '.object_access_records[]
              | select((.activity | ascii_upcase) == "REMOVE")
              | if ((.object_type | ascii_upcase) == "CATALOG") then
                  "module.object_access.databricks_grant.catalog_add[\"\((.environment | ascii_upcase))|\((.access_for | ascii_downcase))|\((.principal_name | ascii_downcase))|CATALOG|\(.catalog)|\((.privilege | ascii_upcase))\"]"
                elif ((.object_type | ascii_upcase) == "SCHEMA") then
                  "module.object_access.databricks_grant.schema_add[\"\((.environment | ascii_upcase))|\((.access_for | ascii_downcase))|\((.principal_name | ascii_downcase))|SCHEMA|\(.catalog)|\(.schema)|\((.privilege | ascii_upcase))\"]"
                elif ((.object_type | ascii_upcase) == "VIEW") then
                  "module.object_access.databricks_grant.view_add[\"\((.environment | ascii_upcase))|\((.access_for | ascii_downcase))|\((.principal_name | ascii_downcase))|VIEW|\(.catalog)|\(.schema)|\(.object_name)|\((.privilege | ascii_upcase))\"]"
                else empty end' "$TFVARS_JSON")

            if [ "${#TARGETS[@]}" -eq 0 ]; then
              echo "No revoke targets found for REMOVE/REVOKE template." >&2
              exit 1
            fi

            target_args=()
            for t in "${TARGETS[@]}"; do
              echo "Revoke target: $t"
              target_args+=("-target=$t")
            done

            terraform -chdir=terraform plan \
              -lock-timeout=10m \
              -destroy \
              -var-file="../$TFVARS_JSON" \
              "${target_args[@]}" \
              -out="../$TFPLAN_BIN"
          else
            terraform -chdir=terraform plan \
              -lock-timeout=10m \
              -var-file="../$TFVARS_JSON" \
              -out="../$TFPLAN_BIN"
          fi

          terraform -chdir=terraform show -no-color "../$TFPLAN_BIN" > "$TFPLAN_TXT"

      - name: Publish plan outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uda-dbx-object-access-plan-output-${{ steps.prep_paths.outputs.request_id }}
          path: ${{ steps.prep_paths.outputs.output_dir }}
          if-no-files-found: warn

      - name: Write plan summary
        if: always()
        run: |
          {
            echo "## Plan Result"
            echo "- Template file: $TEMPLATE_FILE"
            echo "- Output dir: $OUTPUT_DIR"
            echo "- Plan text: $TFPLAN_TXT"
          } >> "$GITHUB_STEP_SUMMARY"

  apply-object-access:
    needs: [detect-templates, plan-object-access]
    if: ${{ needs.detect-templates.outputs.has_templates == 'true' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.run_plan && inputs.run_apply)) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect-templates.outputs.matrix) }}
    environment: prod
    env:
      TEMPLATE_FILE: ${{ matrix.template_file }}
      OUTPUT_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.output_dir || 'uda/output/object-access' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml openpyxl xlrd

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prepare output paths
        id: prep_paths
        shell: bash
        run: |
          template_name="$(basename "$TEMPLATE_FILE")"
          request_id="${template_name%.*}"
          output_dir="$OUTPUT_ROOT/$request_id"
          mkdir -p "$output_dir"
          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"
          echo "TFVARS_JSON=$output_dir/object-access.auto.tfvars.json" >> "$GITHUB_ENV"
          echo "TFPLAN_BIN=$output_dir/object-access.tfplan" >> "$GITHUB_ENV"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Download plan outputs
        uses: actions/download-artifact@v4
        with:
          name: uda-dbx-object-access-plan-output-${{ steps.prep_paths.outputs.request_id }}
          path: ${{ steps.prep_paths.outputs.output_dir }}

      - name: Determine request activity from parsed rows
        shell: bash
        run: |
          REQUEST_ACTIVITY="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["TFVARS_JSON"]).read_text(encoding="utf-8"))
          activities = sorted({str(r.get("activity", "")).strip().upper() for r in payload.get("object_access_records", []) if str(r.get("activity", "")).strip()})

          if not activities:
              raise SystemExit("No activity found in parsed template rows")

          normalized = set()
          for a in activities:
              if a == "REVOKE":
                  normalized.add("REMOVE")
              else:
                  normalized.add(a)

          if len(normalized) != 1:
              raise SystemExit(f"Mixed activities are not supported in a single template. Found={sorted(normalized)}")

          print(next(iter(normalized)))
          PY
          )"
          echo "REQUEST_ACTIVITY=$REQUEST_ACTIVITY" >> "$GITHUB_ENV"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Load Databricks secrets from Key Vault
        shell: bash
        run: |
          KV="${{ secrets.KEYVAULT_NAME }}"

          get_kv_secret() {
            local out_var="$1"
            shift
            local names=("$@")
            local value=""
            for secret_name in "${names[@]}"; do
              value="$(az keyvault secret show --vault-name "$KV" --name "$secret_name" --query value -o tsv 2>/dev/null | tr -d '\r' || true)"
              if [ -n "$value" ]; then
                printf -v "$out_var" '%s' "$value"
                return 0
              fi
            done
            echo "Missing Key Vault secret. Tried names: ${names[*]}" >&2
            exit 1
          }

          get_kv_secret DATABRICKS_HOST_RAW DATABRICKS-HOST DB-HOST
          DATABRICKS_HOST_VALUE="$(echo "$DATABRICKS_HOST_RAW" | sed -E 's#^(https://[^/]+).*$#\1#' | sed 's#/$##')"
          get_kv_secret DATABRICKS_CLIENT_ID_VALUE DB-CLIENT-ID DATABRICKS-CLIENT-ID
          get_kv_secret DATABRICKS_CLIENT_SECRET_VALUE DB-CLIENT-SECRET DATABRICKS-CLIENT-SECRET
          get_kv_secret DATABRICKS_TENANT_ID_VALUE DB-TENANT-ID DATABRICKS-TENANT-ID
          get_kv_secret TFSTATE_RESOURCE_GROUP_VALUE TFSTATE-RESOURCE-GROUP TFSTATE-RESOURCE-GROUP-DBX-UDA
          get_kv_secret TFSTATE_STORAGE_ACCOUNT_VALUE TFSTATE-STORAGE-ACCOUNT TFSTATE-STORAGE-ACCOUNT-DBX-UDA
          get_kv_secret TFSTATE_CONTAINER_VALUE TFSTATE-CONTAINER-DBX-UDA TFSTATE-CONTAINER
          get_kv_secret TFSTATE_KEY_PREFIX_VALUE TFSTATE-KEY-PREFIX TFSTATE-KEY-ROOT TFSTATE-KEY-DBX TFSTATE-KEY
          get_kv_secret TFSTATE_ACCESS_KEY_VALUE TFSTATE-STORAGE-ACCESS-KEY TFSTATE-ACCESS-KEY TFSTATE-STORAGE-KEY STORAGE-ACCOUNT-KEY

          readarray -t KEY_PARTS < <(python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          payload = json.loads(Path(os.environ["TFVARS_JSON"]).read_text(encoding="utf-8"))
          records = payload.get("object_access_records", [])

          if not records:
              raise SystemExit("No object_access_records found in tfvars")

          envs = {str(r.get("environment", "")).strip().lower() for r in records if str(r.get("environment", "")).strip()}
          access_types = {str(r.get("access_for", "")).strip().lower() for r in records if str(r.get("access_for", "")).strip()}
          principals = {str(r.get("principal_name", "")).strip().lower() for r in records if str(r.get("principal_name", "")).strip()}

          if len(envs) != 1 or len(access_types) != 1 or len(principals) != 1:
              raise SystemExit(
                  "Expected a single environment/access_for/principal per template. "
                  f"Found env={sorted(envs)}, access_for={sorted(access_types)}, principal={sorted(principals)}"
              )

          def norm(v: str) -> str:
              return re.sub(r"[^a-z0-9]+", "_", v).strip("_") or "unknown"

          print(norm(next(iter(envs))))
          print(norm(next(iter(access_types))))
          print(norm(next(iter(principals))))
          PY
          )

          KEY_ENV="${KEY_PARTS[0]:-unknown}"
          KEY_ACCESS_FOR="${KEY_PARTS[1]:-unknown}"
          KEY_PRINCIPAL="${KEY_PARTS[2]:-unknown}"

          KEY_PREFIX="$TFSTATE_KEY_PREFIX_VALUE"
          if [[ "$KEY_PREFIX" == *.tfstate ]]; then
            KEY_PREFIX="${KEY_PREFIX%/*}"
          fi
          KEY_PREFIX="${KEY_PREFIX%/}"
          if [ -z "$KEY_PREFIX" ]; then
            KEY_PREFIX="databricks/object-access"
          fi

          TFSTATE_KEY_EFFECTIVE="$KEY_PREFIX/$KEY_ENV/$KEY_ACCESS_FOR/$KEY_PRINCIPAL.tfstate"

          for v in DATABRICKS_HOST_VALUE DATABRICKS_CLIENT_ID_VALUE DATABRICKS_CLIENT_SECRET_VALUE DATABRICKS_TENANT_ID_VALUE TFSTATE_RESOURCE_GROUP_VALUE TFSTATE_STORAGE_ACCOUNT_VALUE TFSTATE_CONTAINER_VALUE TFSTATE_KEY_PREFIX_VALUE TFSTATE_ACCESS_KEY_VALUE; do
            if [ -z "${!v}" ]; then
              echo "Missing or empty secret value for $v from Key Vault $KV" >&2
              exit 1
            fi
          done

          echo "::add-mask::$DATABRICKS_CLIENT_SECRET_VALUE"
          echo "::add-mask::$TFSTATE_ACCESS_KEY_VALUE"

          echo "TF_VAR_databricks_host=$DATABRICKS_HOST_VALUE" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_id=$DATABRICKS_CLIENT_ID_VALUE" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_secret=$DATABRICKS_CLIENT_SECRET_VALUE" >> "$GITHUB_ENV"

          echo "TF_BACKEND_RESOURCE_GROUP_NAME=$TFSTATE_RESOURCE_GROUP_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_STORAGE_ACCOUNT_NAME=$TFSTATE_STORAGE_ACCOUNT_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_CONTAINER_NAME=$TFSTATE_CONTAINER_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_KEY=$TFSTATE_KEY_EFFECTIVE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_ACCESS_KEY=$TFSTATE_ACCESS_KEY_VALUE" >> "$GITHUB_ENV"

          echo "DATABRICKS_HOST=$DATABRICKS_HOST_VALUE" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_ID=$DATABRICKS_CLIENT_ID_VALUE" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_SECRET=$DATABRICKS_CLIENT_SECRET_VALUE" >> "$GITHUB_ENV"

      - name: Terraform init (with retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Terraform init attempt $attempt/3"
            if terraform -chdir=terraform init \
              -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP_NAME" \
              -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT_NAME" \
              -backend-config="container_name=$TF_BACKEND_CONTAINER_NAME" \
              -backend-config="key=$TF_BACKEND_KEY" \
              -backend-config="access_key=$TF_BACKEND_ACCESS_KEY"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "terraform init failed after 3 attempts" >&2
          exit 1

      - name: Terraform apply
        shell: bash
        run: |
          set -euo pipefail

          apply_log="$(mktemp)"

          if terraform -chdir=terraform apply -lock-timeout=10m -auto-approve "../$TFPLAN_BIN" 2>&1 | tee "$apply_log"; then
            exit 0
          fi

          if ! grep -q "Saved plan is stale" "$apply_log"; then
            echo "Terraform apply failed for a reason other than stale plan." >&2
            exit 1
          fi

          echo "Saved plan is stale. Rebuilding plan from current state and retrying apply once..."

          if [ "$REQUEST_ACTIVITY" = "REMOVE" ]; then
            mapfile -t TARGETS < <(jq -r '.object_access_records[]
              | select((.activity | ascii_upcase) == "REMOVE")
              | if ((.object_type | ascii_upcase) == "CATALOG") then
                  "module.object_access.databricks_grant.catalog_add[\"\((.environment | ascii_upcase))|\((.access_for | ascii_downcase))|\((.principal_name | ascii_downcase))|CATALOG|\(.catalog)|\((.privilege | ascii_upcase))\"]"
                elif ((.object_type | ascii_upcase) == "SCHEMA") then
                  "module.object_access.databricks_grant.schema_add[\"\((.environment | ascii_upcase))|\((.access_for | ascii_downcase))|\((.principal_name | ascii_downcase))|SCHEMA|\(.catalog)|\(.schema)|\((.privilege | ascii_upcase))\"]"
                elif ((.object_type | ascii_upcase) == "VIEW") then
                  "module.object_access.databricks_grant.view_add[\"\((.environment | ascii_upcase))|\((.access_for | ascii_downcase))|\((.principal_name | ascii_downcase))|VIEW|\(.catalog)|\(.schema)|\(.object_name)|\((.privilege | ascii_upcase))\"]"
                else empty end' "$TFVARS_JSON")

            if [ "${#TARGETS[@]}" -eq 0 ]; then
              echo "No revoke targets found for REMOVE/REVOKE template." >&2
              exit 1
            fi

            target_args=()
            for t in "${TARGETS[@]}"; do
              target_args+=("-target=$t")
            done

            terraform -chdir=terraform plan \
              -lock-timeout=10m \
              -destroy \
              -var-file="../$TFVARS_JSON" \
              "${target_args[@]}" \
              -out="../$TFPLAN_BIN"
          else
            terraform -chdir=terraform plan \
              -lock-timeout=10m \
              -var-file="../$TFVARS_JSON" \
              -out="../$TFPLAN_BIN"
          fi

          terraform -chdir=terraform apply -lock-timeout=10m -auto-approve "../$TFPLAN_BIN"
