name: UDA Databricks Object Access
on:
  push:
    branches:
      - feature/furqan-udda
    paths:
      - "uda/attachments/object-access/**"
      - "uda/templates/object-access/object-access-yaml-template.yaml"
      - ".github/workflows/uda-dbx-object-access.yml"
  pull_request:
    branches:
      - feature-furqan-udda
    paths:
      - "uda/attachments/object-access/**"
      - "uda/templates/object-access/object-access-yaml-template.yaml"
      - ".github/workflows/uda-dbx-object-access.yml"
  workflow_dispatch:
    inputs:
      request_file:
        description: Path to request YAML file
        required: true
        default: uda/requests/object-access/RITM123456.yaml
        type: string
      request_files:
        description: Optional comma or newline separated request YAML paths
        required: false
        default: ""
        type: string
      attachments_dir:
        description: Directory containing uploaded template attachments
        required: true
        default: uda/attachments/object-access
        type: string
      output_dir:
        description: Directory to write parsed/tfvars/plan outputs
        required: true
        default: uda/output/object-access
        type: string
      run_plan:
        description: Run Terraform plan stage
        required: true
        default: true
        type: boolean
      run_apply:
        description: Run Terraform apply stage (main branch only)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: uda-dbx-object-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-requests:
    runs-on: ubuntu-latest
    outputs:
      has_requests: ${{ steps.collect.outputs.has_requests }}
      matrix: ${{ steps.collect.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect request files
        id: collect
        shell: bash
        env:
          REQUEST_FILE_INPUT: ${{ inputs.request_file }}
          REQUEST_FILES_INPUT: ${{ inputs.request_files }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            request_file="${REQUEST_FILE_INPUT:-uda/requests/object-access/RITM123456.yaml}"
            request_files_raw="${REQUEST_FILES_INPUT:-}"

            if [ -n "$request_files_raw" ]; then
              mapfile -t requested_files < <(printf '%s\n' "$request_files_raw" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | sed '/^$/d' | awk '!seen[$0]++')
            else
              requested_files=("$request_file")
            fi

            if [ "${#requested_files[@]}" -eq 0 ]; then
              echo "No request files were provided for workflow_dispatch." >&2
              exit 1
            fi

            missing=0
            for f in "${requested_files[@]}"; do
              if [ ! -f "$f" ]; then
                echo "Requested file not found: $f" >&2
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              exit 1
            fi

            matrix_json="$(python -c "import json,sys; print(json.dumps({'include':[{'request_file':f} for f in sys.argv[1:] if f]}))" "${requested_files[@]}")"
            echo "has_requests=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
            if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              base_sha="$(git rev-parse HEAD~1)"
            fi
          fi

          mapfile -t changed_request_files < <(git diff --name-only --diff-filter=ACMR "$base_sha" "$head_sha" -- "uda/requests/object-access/*.yaml")
          mapfile -t changed_attachment_files < <(git diff --name-only --diff-filter=ACMR "$base_sha" "$head_sha" -- "uda/attachments/object-access/*")

          existing_files=()
          missing_request_links=0
          declare -A seen

          add_request_file() {
            local request_file="$1"
            if [ -z "${seen[$request_file]+x}" ]; then
              existing_files+=("$request_file")
              seen["$request_file"]=1
            fi
          }

          for f in "${changed_request_files[@]}"; do
            add_request_file "$f"
          done

          for attachment in "${changed_attachment_files[@]}"; do
            if [ ! -f "$attachment" ]; then
              continue
            fi

            attachment_name="$(basename "$attachment")"
            request_stem="${attachment_name%.*}"
            linked=0

            if [[ "$request_stem" =~ ^RITM[0-9]+$ ]]; then
              candidate_request="uda/requests/object-access/$request_stem.yaml"
              add_request_file "$candidate_request"
              linked=1
            fi

            if [ "$linked" -eq 0 ]; then
              mapfile -t yaml_matches < <(python -c "import re,sys;from pathlib import Path;name=sys.argv[1];req=Path('uda/requests/object-access');pat=re.compile(r'^\\s*template_file\\s*:\\s*[\'\"]?([^\'\"\\s#]+)[\'\"]?\\s*$',re.I);out=[];[out.append(str(f).replace('\\\\','/')) for f in sorted(req.glob('*.yaml')) if any((m:=pat.match(line)) and m.group(1).strip()==name for line in f.read_text(encoding='utf-8').splitlines())];print('\\n'.join(out))" "$attachment_name")

              if [ "${#yaml_matches[@]}" -eq 1 ]; then
                add_request_file "${yaml_matches[0]}"
                linked=1
              elif [ "${#yaml_matches[@]}" -gt 1 ]; then
                echo "Attachment $attachment_name matches multiple request YAML files: ${yaml_matches[*]}" >&2
                missing_request_links=1
              fi
            fi

            if [ "$linked" -eq 0 ]; then
              echo "Attachment changed but request YAML link could not be resolved for: $attachment_name" >&2
              missing_request_links=1
            fi
          done

          if [ "$missing_request_links" -ne 0 ]; then
            exit 1
          fi

          if [ "${#existing_files[@]}" -eq 0 ]; then
            echo "has_requests=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          matrix_json="$(python -c "import json,sys; print(json.dumps({'include':[{'request_file':f} for f in sys.argv[1:] if f]}))" "${existing_files[@]}")"
          echo "has_requests=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  plan-object-access:
    needs: detect-requests
    if: ${{ needs.detect-requests.outputs.has_requests == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_plan) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect-requests.outputs.matrix) }}
    env:
      REQUEST_FILE: ${{ matrix.request_file }}
      ATTACHMENTS_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.attachments_dir || 'uda/attachments/object-access' }}
      OUTPUT_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.output_dir || 'uda/output/object-access' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install workflow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml openpyxl xlrd

      - name: Prepare output paths
        id: prep_paths
        shell: bash
        run: |
          request_id="$(basename "$REQUEST_FILE" .yaml)"
          output_dir="$OUTPUT_ROOT/$request_id"
          mkdir -p "$output_dir"
          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"
          echo "PARSED_JSON=$output_dir/parsed-object-access.json" >> "$GITHUB_ENV"
          echo "TFVARS_JSON=$output_dir/object-access.auto.tfvars.json" >> "$GITHUB_ENV"
          echo "TFPLAN_BIN=$output_dir/object-access.tfplan" >> "$GITHUB_ENV"
          echo "TFPLAN_TXT=$output_dir/object-access-plan.txt" >> "$GITHUB_ENV"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Generate or refresh request YAML from attachment
        shell: bash
        run: |
          set -euo pipefail
          request_id="$(basename "$REQUEST_FILE" .yaml)"
          template_file="$ATTACHMENTS_DIR/$request_id.xlsx"
          if [ ! -f "$template_file" ] && [ -f "$ATTACHMENTS_DIR/$request_id.xlsm" ]; then
            template_file="$ATTACHMENTS_DIR/$request_id.xlsm"
          fi
          if [ ! -f "$template_file" ] && [ -f "$ATTACHMENTS_DIR/$request_id.xls" ]; then
            template_file="$ATTACHMENTS_DIR/$request_id.xls"
          fi

          if [ ! -f "$template_file" ]; then
            if [ -f "$REQUEST_FILE" ]; then
              template_candidate="$(python -c "import os,yaml; from pathlib import Path; p=Path(os.environ['REQUEST_FILE']); d=yaml.safe_load(p.read_text(encoding='utf-8')) or {}; print(str(d.get('template_file','')).strip())")"
              if [ -n "$template_candidate" ] && [ -f "$ATTACHMENTS_DIR/$template_candidate" ]; then
                template_file="$ATTACHMENTS_DIR/$template_candidate"
              fi
            fi
          fi

          if [ ! -f "$template_file" ]; then
            echo "Unable to resolve attachment template for request $request_id" >&2
            exit 1
          fi

          if ! python uda/scripts/object-access/generate_request_yaml.py \
            --request-id "$request_id" \
            --template-file "$template_file" \
            --sheet-name "Object List" \
            --output-file "$REQUEST_FILE"; then
            python uda/scripts/object-access/generate_request_yaml.py \
              --request-id "$request_id" \
              --template-file "$template_file" \
              --sheet-name "ObjectAccess" \
              --output-file "$REQUEST_FILE"
          fi

      - name: Resolve template path from request YAML
        id: resolve_template
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          request_file = Path(os.environ["REQUEST_FILE"])
          attachments_dir = Path(os.environ["ATTACHMENTS_DIR"])

          with request_file.open("r", encoding="utf-8") as handle:
              payload = yaml.safe_load(handle) or {}

          template_file = str(payload.get("template_file", "")).strip()
          if not template_file:
              raise SystemExit("template_file is missing in request YAML")

          resolved_path = attachments_dir / template_file
          print(f"Resolved template file: {resolved_path}")

          requested_sheet = str(payload.get("object_list_sheet_name", "")).strip()

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"template_file={resolved_path}\n")
              out.write(f"requested_sheet={requested_sheet}\n")
          PY

      - name: Resolve object list worksheet name
        id: resolve_sheet
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from openpyxl import load_workbook

          template_path = Path("${{ steps.resolve_template.outputs.template_file }}")
          requested_sheet = "${{ steps.resolve_template.outputs.requested_sheet }}".strip()

          wb = load_workbook(template_path, data_only=True)
          sheetnames = wb.sheetnames

          candidate_order = []
          if requested_sheet:
            candidate_order.append(requested_sheet)
          candidate_order.extend(["ObjectAccess", "Object List"])

          resolved = ""
          for candidate in candidate_order:
            if candidate in sheetnames:
              resolved = candidate
              break

          if not resolved:
            raise SystemExit(
              "Unable to resolve object list worksheet. "
              f"Requested='{requested_sheet}'. Available sheets={sheetnames}"
            )

          print(f"Resolved object list worksheet: {resolved}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"sheet_name={resolved}\n")
          PY

      - name: Validate request YAML
        run: |
          python uda/scripts/object-access/validate_request.py \
            --request-file "$REQUEST_FILE" \
            --attachments-dir "$ATTACHMENTS_DIR"

      - name: Determine request activity
        shell: bash
        run: |
          REQUEST_ACTIVITY="$(python - <<'PY'
          import os
          import yaml
          from pathlib import Path
          req = Path(os.environ["REQUEST_FILE"])
          payload = yaml.safe_load(req.read_text(encoding="utf-8")) or {}
          print(str(payload.get("activity_type", "")).strip().upper())
          PY
          )"
          echo "REQUEST_ACTIVITY=$REQUEST_ACTIVITY" >> "$GITHUB_ENV"

      - name: Validate object access template
        run: |
          python uda/scripts/object-access/validate_template.py \
            --template-file "${{ steps.resolve_template.outputs.template_file }}" \
            --request-file "$REQUEST_FILE" \
            --sheet-name "${{ steps.resolve_sheet.outputs.sheet_name }}"

      - name: Parse object access template
        run: |
          python uda/scripts/object-access/parse_template.py \
            --template-file "${{ steps.resolve_template.outputs.template_file }}" \
            --request-file "$REQUEST_FILE" \
            --sheet-name "${{ steps.resolve_sheet.outputs.sheet_name }}" \
            --output-file "$PARSED_JSON"

      - name: Generate tfvars JSON
        run: |
          python uda/scripts/object-access/generate_tfvars.py \
            --input-json "$PARSED_JSON" \
            --output-json "$TFVARS_JSON"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Load Databricks secrets from Key Vault
        shell: bash
        run: |
          KV="${{ secrets.KEYVAULT_NAME }}"

          get_kv_secret() {
            local out_var="$1"
            shift
            local names=("$@")
            local value=""
            for secret_name in "${names[@]}"; do
              value="$(az keyvault secret show --vault-name "$KV" --name "$secret_name" --query value -o tsv 2>/dev/null | tr -d '\r' || true)"
              if [ -n "$value" ]; then
                printf -v "$out_var" '%s' "$value"
                return 0
              fi
            done
            echo "Missing Key Vault secret. Tried names: ${names[*]}" >&2
            exit 1
          }

          get_kv_secret DATABRICKS_HOST_RAW DATABRICKS-HOST DB-HOST
          DATABRICKS_HOST_VALUE="$(echo "$DATABRICKS_HOST_RAW" | sed -E 's#^(https://[^/]+).*$#\1#' | sed 's#/$##')"
          get_kv_secret DATABRICKS_CLIENT_ID_VALUE DB-CLIENT-ID DATABRICKS-CLIENT-ID
          get_kv_secret DATABRICKS_CLIENT_SECRET_VALUE DB-CLIENT-SECRET DATABRICKS-CLIENT-SECRET
          get_kv_secret DATABRICKS_TENANT_ID_VALUE DB-TENANT-ID DATABRICKS-TENANT-ID
          get_kv_secret TFSTATE_RESOURCE_GROUP_VALUE TFSTATE-RESOURCE-GROUP TFSTATE-RESOURCE-GROUP-DBX-UDA
          get_kv_secret TFSTATE_STORAGE_ACCOUNT_VALUE TFSTATE-STORAGE-ACCOUNT TFSTATE-STORAGE-ACCOUNT-DBX-UDA
          get_kv_secret TFSTATE_CONTAINER_VALUE TFSTATE-CONTAINER-DBX-UDA TFSTATE-CONTAINER
          get_kv_secret TFSTATE_KEY_PREFIX_VALUE TFSTATE-KEY-PREFIX TFSTATE-KEY-ROOT TFSTATE-KEY-DBX TFSTATE-KEY
          get_kv_secret TFSTATE_ACCESS_KEY_VALUE TFSTATE-STORAGE-ACCESS-KEY TFSTATE-ACCESS-KEY TFSTATE-STORAGE-KEY STORAGE-ACCOUNT-KEY

          KEY_PREFIX="$TFSTATE_KEY_PREFIX_VALUE"
          if [[ "$KEY_PREFIX" == *.tfstate ]]; then
            TFSTATE_KEY_EFFECTIVE="$KEY_PREFIX"
          else
            KEY_PREFIX="${KEY_PREFIX%/}"
            if [ -z "$KEY_PREFIX" ]; then
              KEY_PREFIX="databricks/object-access"
            fi
            TFSTATE_KEY_EFFECTIVE="$KEY_PREFIX/object-access.tfstate"
          fi

          for v in DATABRICKS_HOST_VALUE DATABRICKS_CLIENT_ID_VALUE DATABRICKS_CLIENT_SECRET_VALUE DATABRICKS_TENANT_ID_VALUE TFSTATE_RESOURCE_GROUP_VALUE TFSTATE_STORAGE_ACCOUNT_VALUE TFSTATE_CONTAINER_VALUE TFSTATE_KEY_PREFIX_VALUE TFSTATE_ACCESS_KEY_VALUE; do
            if [ -z "${!v}" ]; then
              echo "Missing or empty secret value for $v from Key Vault $KV" >&2
              exit 1
            fi
          done

          if [[ "$DATABRICKS_HOST_VALUE" != https://* ]]; then
            echo "DATABRICKS-HOST must start with https://. Current value appears invalid." >&2
            exit 1
          fi

          if [[ "$DATABRICKS_HOST_VALUE" == *"accounts."* ]]; then
            echo "DATABRICKS-HOST points to an account console URL ($DATABRICKS_HOST_VALUE). Use a workspace URL like https://adb-<workspace-id>.<region>.azuredatabricks.net." >&2
            exit 1
          fi

          echo "::add-mask::$DATABRICKS_CLIENT_SECRET_VALUE"
          echo "::add-mask::$TFSTATE_ACCESS_KEY_VALUE"

          echo "TF_VAR_databricks_host=$DATABRICKS_HOST_VALUE" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_id=$DATABRICKS_CLIENT_ID_VALUE" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_secret=$DATABRICKS_CLIENT_SECRET_VALUE" >> "$GITHUB_ENV"

          echo "TF_BACKEND_RESOURCE_GROUP_NAME=$TFSTATE_RESOURCE_GROUP_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_STORAGE_ACCOUNT_NAME=$TFSTATE_STORAGE_ACCOUNT_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_CONTAINER_NAME=$TFSTATE_CONTAINER_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_KEY=$TFSTATE_KEY_EFFECTIVE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_ACCESS_KEY=$TFSTATE_ACCESS_KEY_VALUE" >> "$GITHUB_ENV"

          echo "DATABRICKS_HOST=$DATABRICKS_HOST_VALUE" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_ID=$DATABRICKS_CLIENT_ID_VALUE" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_SECRET=$DATABRICKS_CLIENT_SECRET_VALUE" >> "$GITHUB_ENV"

          echo "Derived backend key: $TFSTATE_KEY_EFFECTIVE"

      - name: Terraform init (with retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Terraform init attempt $attempt/3"
            init_log="$(mktemp)"
            if terraform -chdir=terraform init \
              -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP_NAME" \
              -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT_NAME" \
              -backend-config="container_name=$TF_BACKEND_CONTAINER_NAME" \
              -backend-config="key=$TF_BACKEND_KEY" \
              -backend-config="access_key=$TF_BACKEND_ACCESS_KEY" 2>&1 | tee "$init_log"; then
              exit 0
            fi

            if grep -qi "AuthorizationPermissionMismatch" "$init_log" || grep -qi "unexpected status 403" "$init_log" || grep -qi "AuthenticationFailed" "$init_log"; then
              echo "Terraform backend authentication/authorization failed." >&2
              echo "Verify TFSTATE-STORAGE-ACCESS-KEY (or alias) matches storage account $TF_BACKEND_STORAGE_ACCOUNT_NAME and has access to container $TF_BACKEND_CONTAINER_NAME." >&2
              echo "Backend target: account=$TF_BACKEND_STORAGE_ACCOUNT_NAME container=$TF_BACKEND_CONTAINER_NAME key=$TF_BACKEND_KEY" >&2
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "terraform init failed (transient?). Retrying in 15s..."
              sleep 15
            fi
          done
          echo "terraform init failed after 3 attempts" >&2
          exit 1

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        shell: bash
        run: |
          if [ "$REQUEST_ACTIVITY" = "REVOKE" ] || [ "$REQUEST_ACTIVITY" = "REMOVE" ]; then
            echo "Building REVOKE target list from parsed records..."
            mapfile -t TARGETS < <(jq -r '.object_access_records[] | select((.activity | ascii_upcase) == "REMOVE" or (.activity | ascii_upcase) == "REVOKE") | if ((.object_type | ascii_upcase) == "CATALOG") then "module.object_access.databricks_grant.catalog_add[\"\((.environment | ascii_upcase))|\((.access_for | ascii_downcase))|\((.principal_name | ascii_downcase))|CATALOG|\(.catalog)|\((.privilege | ascii_upcase))\"]" elif ((.object_type | ascii_upcase) == "SCHEMA") then "module.object_access.databricks_grant.schema_add[\"\((.environment | ascii_upcase))|\((.access_for | ascii_downcase))|\((.principal_name | ascii_downcase))|SCHEMA|\(.catalog)|\(.schema)|\((.privilege | ascii_upcase))\"]" elif ((.object_type | ascii_upcase) == "VIEW") then "module.object_access.databricks_grant.view_add[\"\((.environment | ascii_upcase))|\((.access_for | ascii_downcase))|\((.principal_name | ascii_downcase))|VIEW|\(.catalog)|\(.schema)|\(.object_name)|\((.privilege | ascii_upcase))\"]" else empty end' "$TFVARS_JSON")

            if [ "${#TARGETS[@]}" -eq 0 ]; then
              echo "No revoke targets found for REVOKE request." >&2
              exit 1
            fi

            target_args=()
            for t in "${TARGETS[@]}"; do
              echo "Revoke target: $t"
              target_args+=("-target=$t")
            done

            terraform -chdir=terraform plan \
              -lock-timeout=10m \
              -destroy \
              -var-file="../$TFVARS_JSON" \
              "${target_args[@]}" \
              -out="../$TFPLAN_BIN"
          else
            terraform -chdir=terraform plan \
              -lock-timeout=10m \
              -var-file="../$TFVARS_JSON" \
              -out="../$TFPLAN_BIN"
          fi
          terraform -chdir=terraform show -no-color "../$TFPLAN_BIN" > "$TFPLAN_TXT"

      - name: Publish plan outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uda-dbx-object-access-plan-output-${{ steps.prep_paths.outputs.request_id }}
          path: ${{ steps.prep_paths.outputs.output_dir }}
          if-no-files-found: warn

      - name: Write plan summary
        if: always()
        run: |
          {
            echo "## Plan Result"
            echo "- Request file: $REQUEST_FILE"
            echo "- Template file: ${{ steps.resolve_template.outputs.template_file }}"
            echo "- Output dir: $OUTPUT_DIR"
            echo "- Plan text: $TFPLAN_TXT"
          } >> "$GITHUB_STEP_SUMMARY"

  apply-object-access:
    needs: [detect-requests, plan-object-access]
    if: ${{ needs.detect-requests.outputs.has_requests == 'true' && ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/furqan-udda')) || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/furqan-udda') && inputs.run_plan && inputs.run_apply)) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect-requests.outputs.matrix) }}
    environment: prod
    env:
      REQUEST_FILE: ${{ matrix.request_file }}
      ATTACHMENTS_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.attachments_dir || 'uda/attachments/object-access' }}
      OUTPUT_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.output_dir || 'uda/output/object-access' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workflow dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml openpyxl xlrd

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Prepare output paths
        id: prep_paths
        shell: bash
        run: |
          request_id="$(basename "$REQUEST_FILE" .yaml)"
          output_dir="$OUTPUT_ROOT/$request_id"
          mkdir -p "$output_dir"
          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"
          echo "TFVARS_JSON=$output_dir/object-access.auto.tfvars.json" >> "$GITHUB_ENV"
          echo "TFPLAN_BIN=$output_dir/object-access.tfplan" >> "$GITHUB_ENV"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Download plan outputs
        uses: actions/download-artifact@v4
        with:
          name: uda-dbx-object-access-plan-output-${{ steps.prep_paths.outputs.request_id }}
          path: ${{ steps.prep_paths.outputs.output_dir }}

      - name: Generate or refresh request YAML from attachment
        shell: bash
        run: |
          set -euo pipefail
          request_id="$(basename "$REQUEST_FILE" .yaml)"
          template_file="$ATTACHMENTS_DIR/$request_id.xlsx"
          if [ ! -f "$template_file" ] && [ -f "$ATTACHMENTS_DIR/$request_id.xlsm" ]; then
            template_file="$ATTACHMENTS_DIR/$request_id.xlsm"
          fi
          if [ ! -f "$template_file" ] && [ -f "$ATTACHMENTS_DIR/$request_id.xls" ]; then
            template_file="$ATTACHMENTS_DIR/$request_id.xls"
          fi

          if [ ! -f "$template_file" ]; then
            if [ -f "$REQUEST_FILE" ]; then
              template_candidate="$(python -c "import os,yaml; from pathlib import Path; p=Path(os.environ['REQUEST_FILE']); d=yaml.safe_load(p.read_text(encoding='utf-8')) or {}; print(str(d.get('template_file','')).strip())")"
              if [ -n "$template_candidate" ] && [ -f "$ATTACHMENTS_DIR/$template_candidate" ]; then
                template_file="$ATTACHMENTS_DIR/$template_candidate"
              fi
            fi
          fi

          if [ ! -f "$template_file" ]; then
            echo "Unable to resolve attachment template for request $request_id" >&2
            exit 1
          fi

          if ! python uda/scripts/object-access/generate_request_yaml.py \
            --request-id "$request_id" \
            --template-file "$template_file" \
            --sheet-name "Object List" \
            --output-file "$REQUEST_FILE"; then
            python uda/scripts/object-access/generate_request_yaml.py \
              --request-id "$request_id" \
              --template-file "$template_file" \
              --sheet-name "ObjectAccess" \
              --output-file "$REQUEST_FILE"
          fi

      - name: Determine request activity
        shell: bash
        run: |
          REQUEST_ACTIVITY="$(python - <<'PY'
          import os
          import yaml
          from pathlib import Path
          req = Path(os.environ["REQUEST_FILE"])
          payload = yaml.safe_load(req.read_text(encoding="utf-8")) or {}
          print(str(payload.get("activity_type", "")).strip().upper())
          PY
          )"
          echo "REQUEST_ACTIVITY=$REQUEST_ACTIVITY" >> "$GITHUB_ENV"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Load Databricks secrets from Key Vault
        shell: bash
        run: |
          KV="${{ secrets.KEYVAULT_NAME }}"

          get_kv_secret() {
            local out_var="$1"
            shift
            local names=("$@")
            local value=""
            for secret_name in "${names[@]}"; do
              value="$(az keyvault secret show --vault-name "$KV" --name "$secret_name" --query value -o tsv 2>/dev/null | tr -d '\r' || true)"
              if [ -n "$value" ]; then
                printf -v "$out_var" '%s' "$value"
                return 0
              fi
            done
            echo "Missing Key Vault secret. Tried names: ${names[*]}" >&2
            exit 1
          }

          get_kv_secret DATABRICKS_HOST_RAW DATABRICKS-HOST DB-HOST
          DATABRICKS_HOST_VALUE="$(echo "$DATABRICKS_HOST_RAW" | sed -E 's#^(https://[^/]+).*$#\1#' | sed 's#/$##')"
          get_kv_secret DATABRICKS_CLIENT_ID_VALUE DB-CLIENT-ID DATABRICKS-CLIENT-ID
          get_kv_secret DATABRICKS_CLIENT_SECRET_VALUE DB-CLIENT-SECRET DATABRICKS-CLIENT-SECRET
          get_kv_secret DATABRICKS_TENANT_ID_VALUE DB-TENANT-ID DATABRICKS-TENANT-ID
          get_kv_secret TFSTATE_RESOURCE_GROUP_VALUE TFSTATE-RESOURCE-GROUP TFSTATE-RESOURCE-GROUP-DBX-UDA
          get_kv_secret TFSTATE_STORAGE_ACCOUNT_VALUE TFSTATE-STORAGE-ACCOUNT TFSTATE-STORAGE-ACCOUNT-DBX-UDA
          get_kv_secret TFSTATE_CONTAINER_VALUE TFSTATE-CONTAINER-DBX-UDA TFSTATE-CONTAINER
          get_kv_secret TFSTATE_KEY_PREFIX_VALUE TFSTATE-KEY-PREFIX TFSTATE-KEY-ROOT TFSTATE-KEY-DBX TFSTATE-KEY
          get_kv_secret TFSTATE_ACCESS_KEY_VALUE TFSTATE-STORAGE-ACCESS-KEY TFSTATE-ACCESS-KEY TFSTATE-STORAGE-KEY STORAGE-ACCOUNT-KEY

          KEY_PREFIX="$TFSTATE_KEY_PREFIX_VALUE"
          if [[ "$KEY_PREFIX" == *.tfstate ]]; then
            TFSTATE_KEY_EFFECTIVE="$KEY_PREFIX"
          else
            KEY_PREFIX="${KEY_PREFIX%/}"
            if [ -z "$KEY_PREFIX" ]; then
              KEY_PREFIX="databricks/object-access"
            fi
            TFSTATE_KEY_EFFECTIVE="$KEY_PREFIX/object-access.tfstate"
          fi

          for v in DATABRICKS_HOST_VALUE DATABRICKS_CLIENT_ID_VALUE DATABRICKS_CLIENT_SECRET_VALUE DATABRICKS_TENANT_ID_VALUE TFSTATE_RESOURCE_GROUP_VALUE TFSTATE_STORAGE_ACCOUNT_VALUE TFSTATE_CONTAINER_VALUE TFSTATE_KEY_PREFIX_VALUE TFSTATE_ACCESS_KEY_VALUE; do
            if [ -z "${!v}" ]; then
              echo "Missing or empty secret value for $v from Key Vault $KV" >&2
              exit 1
            fi
          done

          if [[ "$DATABRICKS_HOST_VALUE" != https://* ]]; then
            echo "DATABRICKS-HOST must start with https://. Current value appears invalid." >&2
            exit 1
          fi

          if [[ "$DATABRICKS_HOST_VALUE" == *"accounts."* ]]; then
            echo "DATABRICKS-HOST points to an account console URL ($DATABRICKS_HOST_VALUE). Use a workspace URL like https://adb-<workspace-id>.<region>.azuredatabricks.net." >&2
            exit 1
          fi

          echo "::add-mask::$DATABRICKS_CLIENT_SECRET_VALUE"
          echo "::add-mask::$TFSTATE_ACCESS_KEY_VALUE"

          echo "TF_VAR_databricks_host=$DATABRICKS_HOST_VALUE" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_id=$DATABRICKS_CLIENT_ID_VALUE" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_secret=$DATABRICKS_CLIENT_SECRET_VALUE" >> "$GITHUB_ENV"

          echo "TF_BACKEND_RESOURCE_GROUP_NAME=$TFSTATE_RESOURCE_GROUP_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_STORAGE_ACCOUNT_NAME=$TFSTATE_STORAGE_ACCOUNT_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_CONTAINER_NAME=$TFSTATE_CONTAINER_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_KEY=$TFSTATE_KEY_EFFECTIVE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_ACCESS_KEY=$TFSTATE_ACCESS_KEY_VALUE" >> "$GITHUB_ENV"

          echo "DATABRICKS_HOST=$DATABRICKS_HOST_VALUE" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_ID=$DATABRICKS_CLIENT_ID_VALUE" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_SECRET=$DATABRICKS_CLIENT_SECRET_VALUE" >> "$GITHUB_ENV"

          echo "Derived backend key: $TFSTATE_KEY_EFFECTIVE"

      - name: Terraform init (with retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Terraform init attempt $attempt/3"
            init_log="$(mktemp)"
            if terraform -chdir=terraform init \
              -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP_NAME" \
              -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT_NAME" \
              -backend-config="container_name=$TF_BACKEND_CONTAINER_NAME" \
              -backend-config="key=$TF_BACKEND_KEY" \
              -backend-config="access_key=$TF_BACKEND_ACCESS_KEY" 2>&1 | tee "$init_log"; then
              exit 0
            fi

            if grep -qi "AuthorizationPermissionMismatch" "$init_log" || grep -qi "unexpected status 403" "$init_log" || grep -qi "AuthenticationFailed" "$init_log"; then
              echo "Terraform backend authentication/authorization failed." >&2
              echo "Verify TFSTATE-STORAGE-ACCESS-KEY (or alias) matches storage account $TF_BACKEND_STORAGE_ACCOUNT_NAME and has access to container $TF_BACKEND_CONTAINER_NAME." >&2
              echo "Backend target: account=$TF_BACKEND_STORAGE_ACCOUNT_NAME container=$TF_BACKEND_CONTAINER_NAME key=$TF_BACKEND_KEY" >&2
              exit 1
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "terraform init failed (transient?). Retrying in 15s..."
              sleep 15
            fi
          done
          echo "terraform init failed after 3 attempts" >&2
          exit 1

      - name: Terraform apply
        shell: bash
        run: |
          set -euo pipefail

          apply_log="$(mktemp)"

          if terraform -chdir=terraform apply -lock-timeout=10m -auto-approve "../$TFPLAN_BIN" 2>&1 | tee "$apply_log"; then
            exit 0
          fi

          if ! grep -q "Saved plan is stale" "$apply_log"; then
            echo "Terraform apply failed for a reason other than stale plan." >&2
            exit 1
          fi

          echo "Saved plan is stale. Rebuilding plan from current state and retrying apply once..."

          if [ "$REQUEST_ACTIVITY" = "REVOKE" ] || [ "$REQUEST_ACTIVITY" = "REMOVE" ]; then
            mapfile -t TARGETS < <(jq -r '.object_access_records[] | select((.activity | ascii_upcase) == "REMOVE" or (.activity | ascii_upcase) == "REVOKE") | if ((.object_type | ascii_upcase) == "CATALOG") then "module.object_access.databricks_grant.catalog_add[\"\((.environment | ascii_upcase))|\((.access_for | ascii_downcase))|\((.principal_name | ascii_downcase))|CATALOG|\(.catalog)|\((.privilege | ascii_upcase))\"]" elif ((.object_type | ascii_upcase) == "SCHEMA") then "module.object_access.databricks_grant.schema_add[\"\((.environment | ascii_upcase))|\((.access_for | ascii_downcase))|\((.principal_name | ascii_downcase))|SCHEMA|\(.catalog)|\(.schema)|\((.privilege | ascii_upcase))\"]" elif ((.object_type | ascii_upcase) == "VIEW") then "module.object_access.databricks_grant.view_add[\"\((.environment | ascii_upcase))|\((.access_for | ascii_downcase))|\((.principal_name | ascii_downcase))|VIEW|\(.catalog)|\(.schema)|\(.object_name)|\((.privilege | ascii_upcase))\"]" else empty end' "$TFVARS_JSON")

            if [ "${#TARGETS[@]}" -eq 0 ]; then
              echo "No revoke targets found for REVOKE request." >&2
              exit 1
            fi

            target_args=()
            for t in "${TARGETS[@]}"; do
              target_args+=("-target=$t")
            done

            terraform -chdir=terraform plan \
              -lock-timeout=10m \
              -destroy \
              -var-file="../$TFVARS_JSON" \
              "${target_args[@]}" \
              -out="../$TFPLAN_BIN"
          else
            terraform -chdir=terraform plan \
              -lock-timeout=10m \
              -var-file="../$TFVARS_JSON" \
              -out="../$TFPLAN_BIN"
          fi

          terraform -chdir=terraform apply -lock-timeout=10m -auto-approve "../$TFPLAN_BIN"
