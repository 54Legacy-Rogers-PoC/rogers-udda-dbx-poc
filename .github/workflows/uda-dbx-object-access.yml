name: UDA Databricks Object Access

on:
  push:
    branches:
      - main
    paths:
      - "requests/object-access/dev/**"
  pull_request:
    branches:
      - main
    paths:
      - "requests/object-access/dev/**"
  workflow_dispatch:
    inputs:
      template_file:
        description: Path to a single Excel template file
        required: true
        type: string
      template_files:
        description: Optional comma or newline separated Excel template paths
        required: false
        default: ""
        type: string
      run_plan:
        description: Run Terraform plan stage
        required: true
        default: true
        type: boolean
      run_apply:
        description: Run Terraform apply stage
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: uda-dbx-object-access-global
  cancel-in-progress: false

jobs:
  detect-templates:
    runs-on: ubuntu-latest
    outputs:
      has_templates: ${{ steps.collect.outputs.has_templates }}
      matrix: ${{ steps.collect.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Collect template files
        id: collect
        shell: bash
        env:
          TEMPLATE_FILE_INPUT: ${{ inputs.template_file }}
          TEMPLATE_FILES_INPUT: ${{ inputs.template_files }}
          BASE_SHA_EVENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA_EVENT: ${{ github.sha }}
        run: |
          bash uda/scripts/object-access/collect_template_files.sh

  plan-object-access:
    needs: [detect-templates]
    if: ${{ needs.detect-templates.outputs.has_templates == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_plan) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect-templates.outputs.matrix) }}
    env:
      TEMPLATE_FILE: ${{ matrix.template_file }}
      OUTPUT_ROOT: uda/output/object-access
      TF_WORKDIR: ${{ github.workspace }}/terraform/environments/dev
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Azure and Databricks
        uses: 54Legacy-Rogers-PoC/54legacy-Resusable-Workflows/actions/setup-databricks@feature/furqan
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ secrets.KEYVAULT_NAME }}
          backend_key: addremove.tfstate

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uda/scripts/object-access/requirements-ci.txt

      - name: Set up Terraform
        id: setup_terraform_plan
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install workflow dependencies
        run: |
          pip install --only-binary=:all: pyyaml==6.0.2 openpyxl==3.1.5 xlrd==2.0.1 requests==2.32.3

      - name: Prepare output paths
        id: prep_paths
        shell: bash
        run: |
          template_name="$(basename "$TEMPLATE_FILE")"
          request_id="${template_name%.*}"
          output_dir="$OUTPUT_ROOT/$request_id"
          mkdir -p "$output_dir"
          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"
          echo "PARSED_JSON=$output_dir/parsed-object-access.json" >> "$GITHUB_ENV"
          echo "TFVARS_JSON=$output_dir/object-access.auto.tfvars.json" >> "$GITHUB_ENV"
          echo "REQUEST_TFVARS_JSON=$output_dir/object-access-request.tfvars.json" >> "$GITHUB_ENV"
          echo "TFVARS_IMPORT_JSON=$output_dir/object-access-import.auto.tfvars.json" >> "$GITHUB_ENV"
          echo "ACTIVE_GRANTS_MANIFEST=$output_dir/active-grants-manifest.json" >> "$GITHUB_ENV"
          echo "TERRAFORM_STATE_JSON=$output_dir/terraform-state.json" >> "$GITHUB_ENV"
          echo "TFPLAN_BIN=$output_dir/object-access.tfplan" >> "$GITHUB_ENV"
          echo "TFPLAN_TXT=$output_dir/object-access-plan.txt" >> "$GITHUB_ENV"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Validate object access template
        run: |
          python uda/scripts/object-access/validate_template.py \
            --template-file "$TEMPLATE_FILE" \
            --sheet-name "Object List"

      - name: Parse object access template
        run: |
          python uda/scripts/object-access/parse_template.py \
            --template-file "$TEMPLATE_FILE" \
            --sheet-name "Object List" \
            --output-file "$PARSED_JSON"

      - name: Generate tfvars JSON
        run: |
          python uda/scripts/object-access/generate_tfvars.py \
            --input-json "$PARSED_JSON" \
            --output-json "$TFVARS_JSON"
          cp "$TFVARS_JSON" "$REQUEST_TFVARS_JSON"

      - name: Determine request activity from parsed rows
        shell: bash
        run: |
          REQUEST_ACTIVITY="$(python uda/scripts/object-access/determine_request_activity.py --tfvars-json "$TFVARS_JSON")"
          echo "REQUEST_ACTIVITY=$REQUEST_ACTIVITY" >> "$GITHUB_ENV"
          echo "$REQUEST_ACTIVITY" > "$OUTPUT_DIR/request_activity.txt"

      - name: Build import tfvars for REMOVE targets
        shell: bash
        run: |
          if [ "${REQUEST_ACTIVITY:-}" = "ADD" ]; then
            echo "Import tfvars not needed for ADD-only request."
            exit 0
          fi

          (
            cd "$OUTPUT_DIR"
            python "$GITHUB_WORKSPACE/uda/scripts/object-access/build_import_tfvars.py"
          )

      - name: Terraform init (with retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Terraform init attempt $attempt/3"
            if [ "${TF_BACKEND_USE_AZUREAD_AUTH:-true}" = "true" ]; then
              if terraform -chdir="$TF_WORKDIR" init \
                -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP_NAME" \
                -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT_NAME" \
                -backend-config="container_name=$TF_BACKEND_CONTAINER_NAME" \
                -backend-config="key=$TF_BACKEND_KEY" \
                -backend-config="use_azuread_auth=true"; then
                exit 0
              fi
            else
              if [ -z "${TF_BACKEND_ACCESS_KEY:-}" ]; then
                echo "TF_BACKEND_ACCESS_KEY is empty; cannot initialize Terraform backend with storage-key auth." >&2
                exit 1
              fi
              if terraform -chdir="$TF_WORKDIR" init \
                -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP_NAME" \
                -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT_NAME" \
                -backend-config="container_name=$TF_BACKEND_CONTAINER_NAME" \
                -backend-config="key=$TF_BACKEND_KEY" \
                -backend-config="use_azuread_auth=false" \
                -backend-config="access_key=$TF_BACKEND_ACCESS_KEY"; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "terraform init failed after 3 attempts" >&2
          exit 1

      - name: Build persistent active-grants manifest
        shell: bash
        run: |
          set -euo pipefail
          environment_name="$(jq -r '.environment | ascii_downcase' "$REQUEST_TFVARS_JSON")"
          manifest_blob="object-access/manifests/${environment_name}.json"
          echo "ACTIVE_GRANTS_BLOB=$manifest_blob" >> "$GITHUB_ENV"

          manifest_exists="$(az storage blob exists \
            --account-name "$TF_BACKEND_STORAGE_ACCOUNT_NAME" \
            --container-name "$TF_BACKEND_CONTAINER_NAME" \
            --name "$manifest_blob" \
            --auth-mode login \
            --query exists \
            --output tsv \
            --only-show-errors)"

          if [ "$manifest_exists" = "true" ]; then
            az storage blob download \
              --account-name "$TF_BACKEND_STORAGE_ACCOUNT_NAME" \
              --container-name "$TF_BACKEND_CONTAINER_NAME" \
              --name "$manifest_blob" \
              --file "$ACTIVE_GRANTS_MANIFEST" \
              --auth-mode login \
              --overwrite true \
              --only-show-errors
          else
            echo '{}' > "$ACTIVE_GRANTS_MANIFEST"
            echo "No persistent manifest found; bootstrapping from Terraform state."
          fi

          if ! terraform -chdir="$TF_WORKDIR" show -json > "$TERRAFORM_STATE_JSON"; then
            echo '{}' > "$TERRAFORM_STATE_JSON"
            echo "No Terraform state values available for manifest bootstrap."
          fi

          python "$GITHUB_WORKSPACE/uda/scripts/object-access/merge_active_grants.py" \
            --request-json "$REQUEST_TFVARS_JSON" \
            --manifest-json "$ACTIVE_GRANTS_MANIFEST" \
            --state-json "$TERRAFORM_STATE_JSON" \
            --output-json "$TFVARS_JSON"

      - name: Migrate legacy grant state addresses
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_plan && inputs.run_apply) }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir="$TF_WORKDIR" state list > "$OUTPUT_DIR/terraform-state-list.txt"
          python "$GITHUB_WORKSPACE/uda/scripts/object-access/build_state_migrations.py" \
            --state-list "$OUTPUT_DIR/terraform-state-list.txt" \
            --output-tsv "$OUTPUT_DIR/state-migrations.tsv"

          while IFS=$'\t' read -r old_address new_address; do
            if [ -z "$old_address" ] || [ -z "$new_address" ]; then
              continue
            fi
            if terraform -chdir="$TF_WORKDIR" state list | grep -Fx -- "$new_address" >/dev/null; then
              terraform -chdir="$TF_WORKDIR" state rm "$old_address"
            else
              terraform -chdir="$TF_WORKDIR" state mv "$old_address" "$new_address"
            fi
          done < "$OUTPUT_DIR/state-migrations.tsv"

      - name: Import unmanaged revoke targets
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_plan && inputs.run_apply)) }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$REQUEST_ACTIVITY" = "ADD" ]; then
            echo "No revoke targets need import for an ADD-only request."
            exit 0
          fi

          python "$GITHUB_WORKSPACE/uda/scripts/object-access/build_revoke_targets.py" \
            --input-json "$REQUEST_TFVARS_JSON" \
            --output-tsv "$OUTPUT_DIR/revoke_targets.tsv"

          while IFS=$'\t' read -r target import_id; do
            if [ -z "$target" ] || [ -z "$import_id" ]; then
              continue
            fi
            if terraform -chdir="$TF_WORKDIR" state list | grep -Fx -- "$target" >/dev/null; then
              continue
            fi
            echo "Attempting import for unmanaged revoke target: $import_id"
            if ! terraform -chdir="$TF_WORKDIR" import \
              -var-file="$GITHUB_WORKSPACE/$TFVARS_IMPORT_JSON" \
              "$target" "$import_id"; then
              echo "Import did not succeed; post-validation will verify that the grant is already absent: $target"
            fi
          done < "$OUTPUT_DIR/revoke_targets.tsv"

          terraform -chdir="$TF_WORKDIR" show -json > "$TERRAFORM_STATE_JSON"
          python "$GITHUB_WORKSPACE/uda/scripts/object-access/merge_active_grants.py" \
            --request-json "$REQUEST_TFVARS_JSON" \
            --manifest-json "$ACTIVE_GRANTS_MANIFEST" \
            --state-json "$TERRAFORM_STATE_JSON" \
            --output-json "$TFVARS_JSON"

      - name: Terraform plan
        shell: bash
        run: |
          terraform -chdir="$TF_WORKDIR" plan \
            -lock-timeout=10m \
            -var-file="$GITHUB_WORKSPACE/$TFVARS_JSON" \
            -out="$GITHUB_WORKSPACE/$TFPLAN_BIN"
          terraform -chdir="$TF_WORKDIR" show -no-color "$GITHUB_WORKSPACE/$TFPLAN_BIN" > "$TFPLAN_TXT"

      - name: Terraform apply
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_plan && inputs.run_apply) }}
        shell: bash
        run: |
          terraform -chdir="$TF_WORKDIR" apply \
            -lock-timeout=10m \
            -auto-approve \
            "$GITHUB_WORKSPACE/$TFPLAN_BIN"

      - name: Publish plan outputs
        if: ${{ always() && steps.prep_paths.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uda-dbx-object-access-plan-output-${{ steps.prep_paths.outputs.request_id }}
          path: ${{ steps.prep_paths.outputs.output_dir }}
          if-no-files-found: warn

      - name: Write plan summary
        if: always()
        run: |
          {
            echo "## Plan Result"
            echo "- Template file: $TEMPLATE_FILE"
            echo "- Output dir: $OUTPUT_DIR"
            echo "- Request activity: $REQUEST_ACTIVITY"
            echo "- Plan text: $TFPLAN_TXT"
          } >> "$GITHUB_STEP_SUMMARY"

  post-validate-object-access:
    needs: [detect-templates, plan-object-access]
    if: ${{ needs.plan-object-access.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_plan && inputs.run_apply)) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect-templates.outputs.matrix) }}

    env:
      TEMPLATE_FILE: ${{ matrix.template_file }}
      OUTPUT_ROOT: uda/output/object-access
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Azure and Databricks
        uses: 54Legacy-Rogers-PoC/54legacy-Resusable-Workflows/actions/setup-databricks@feature/furqan
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ secrets.KEYVAULT_NAME }}
          backend_key: addremove.tfstate

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uda/scripts/object-access/requirements-ci.txt

      - name: Install workflow dependencies
        run: |
          pip install --only-binary=:all: requests==2.32.3

      - name: Prepare post-validation path
        id: post_paths
        shell: bash
        run: |
          template_name="$(basename "$TEMPLATE_FILE")"
          request_id="${template_name%.*}"
          output_dir="$OUTPUT_ROOT/$request_id"
          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"
          echo "REQUEST_TFVARS_JSON=$output_dir/object-access-request.tfvars.json" >> "$GITHUB_ENV"
          echo "TFVARS_JSON=$output_dir/object-access.auto.tfvars.json" >> "$GITHUB_ENV"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Download plan artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: uda-dbx-object-access-plan-output-${{ steps.post_paths.outputs.request_id }}
          path: ${{ steps.post_paths.outputs.output_dir }}

      - name: Determine request activity from downloaded artifact
        shell: bash
        run: |
          REQUEST_ACTIVITY="$(python "$GITHUB_WORKSPACE/uda/scripts/object-access/determine_request_activity.py" --tfvars-json "$REQUEST_TFVARS_JSON")"
          echo "REQUEST_ACTIVITY=$REQUEST_ACTIVITY" >> "$GITHUB_ENV"

      - name: Validate live Databricks access vs request
        shell: bash
        run: |
          python "$GITHUB_WORKSPACE/uda/scripts/object-access/validate_live_access.py" \
            --manifest-json "$REQUEST_TFVARS_JSON" \
            --databricks-host "$DATABRICKS_HOST" \
            --respect-activity

      - name: Persist active-grants manifest
        shell: bash
        run: |
          set -euo pipefail
          environment_name="$(jq -r '.environment | ascii_downcase' "$REQUEST_TFVARS_JSON")"
          manifest_blob="object-access/manifests/${environment_name}.json"
          az storage blob upload \
            --account-name "$TF_BACKEND_STORAGE_ACCOUNT_NAME" \
            --container-name "$TF_BACKEND_CONTAINER_NAME" \
            --name "$manifest_blob" \
            --file "$TFVARS_JSON" \
            --auth-mode login \
            --overwrite true \
            --only-show-errors
          echo "Persistent active-grants manifest updated: $manifest_blob"

      - name: Write validation summary
        if: always()
        run: |
          {
            echo "## Post Validation Result"
            echo "- Template file: $TEMPLATE_FILE"
            echo "- Output dir: $OUTPUT_DIR"
            echo "- Request activity: $REQUEST_ACTIVITY"
          } >> "$GITHUB_STEP_SUMMARY"
