name: UDA Databricks Object Access

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: "Path to the Request-as-Code YAML"
        required: true
        default: "requests/object-access/dev/RITMDEV0001.yaml"
        type: string
      auto_apply:
        description: "Run terraform apply after successful plan"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "requests/object-access/**"
      - "uda/templates/ObjectAccessTemplate.columns.md"
      - "uda/scripts/object-access/process_request.py"
      - "uda/config/environments.yaml"
      - ".github/workflows/uda-dbx-object-access.yml"

permissions:
  contents: read
  id-token: write

jobs:
  validate_request:
    name: Stage 1-3 Request and Template Validation
    runs-on: ubuntu-latest
    outputs:
      request_file: ${{ steps.request_input.outputs.request_file }}
      request_id: ${{ steps.read_metadata.outputs.request_id }}
      environment: ${{ steps.read_metadata.outputs.environment }}
      principal_type: ${{ steps.read_metadata.outputs.principal_type }}
      principal_name: ${{ steps.read_metadata.outputs.principal_name }}
      object_count: ${{ steps.read_metadata.outputs.object_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r uda/scripts/requirements.txt

      - name: Process request artifact
        run: |
          python uda/scripts/object-access/process_request.py \
            --request-file "${{ github.event.inputs.request_file || 'requests/object-access/dev/RITMDEV0001.yaml' }}" \
            --config-file "uda/config/environments.yaml" \
            --output-dir "generated"

      - name: Resolve request file path
        id: request_input
        run: echo "request_file=${{ github.event.inputs.request_file || 'requests/object-access/dev/RITMDEV0001.yaml' }}" >> "$GITHUB_OUTPUT"

      - name: Read request metadata
        id: read_metadata
        run: |
          echo "request_id=$(jq -r .request_id generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "environment=$(jq -r .environment generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "principal_type=$(jq -r .principal_type generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "principal_name=$(jq -r .principal_name generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "object_count=$(jq -r .object_count generated/request_metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uda-generated
          path: |
            generated/terraform.auto.tfvars.json
            generated/request_metadata.json
            generated/execution_log.json

  terraform_plan:
    name: Stage 4 Terraform Plan
    runs-on: ubuntu-latest
    needs:
      - validate_request
    outputs:
      tf_plan_status: ${{ steps.plan_status.outputs.tf_plan_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-generated
          path: generated

      - name: Setup Azure + KeyVault + Terraform backend
        uses: ./.github/workflows/setup-dbxtf-env
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ secrets.KEYVAULT_NAME }}
          tfstate_key_suffix: object-access

      - name: Terraform validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform/environments/dev
        run: |
          terraform plan \
            -var-file="../../../generated/terraform.auto.tfvars.json" \
            -out="tfplan.binary"
          terraform show -no-color tfplan.binary > tfplan.txt

      - name: Set plan status
        id: plan_status
        run: echo "tf_plan_status=success" >> "$GITHUB_OUTPUT"

      - name: Upload terraform plan output
        uses: actions/upload-artifact@v4
        with:
          name: uda-terraform-plan
          path: |
            terraform/environments/dev/tfplan.binary
            terraform/environments/dev/tfplan.txt

  terraform_apply:
    name: Stage 5 Terraform Apply
    runs-on: ubuntu-latest
    needs:
      - validate_request
      - terraform_plan
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto_apply == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-generated
          path: generated

      - name: Download terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          name: uda-terraform-plan
          path: terraform/environments/dev

      - name: Setup Azure + KeyVault + Terraform backend
        uses: ./.github/workflows/setup-dbxtf-env
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ secrets.KEYVAULT_NAME }}
          tfstate_key_suffix: object-access

      - name: Terraform apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve tfplan.binary

  notification:
    name: Stage 6 Notification and Summary
    runs-on: ubuntu-latest
    needs:
      - validate_request
      - terraform_plan
      - terraform_apply
    if: always()
    steps:
      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-generated
          path: generated

      - name: Publish workflow summary
        run: |
          {
            echo "## Databricks Object Access Execution Summary"
            echo ""
            echo "- Request File: ${{ needs.validate_request.outputs.request_file }}"
            echo "- Request ID: ${{ needs.validate_request.outputs.request_id }}"
            echo "- Principal Type: ${{ needs.validate_request.outputs.principal_type }}"
            echo "- Principal Name: ${{ needs.validate_request.outputs.principal_name }}"
            echo "- Environment: ${{ needs.validate_request.outputs.environment }}"
            echo "- Number of Objects Processed: ${{ needs.validate_request.outputs.object_count }}"
            echo "- Plan Status: ${{ needs.terraform_plan.outputs.tf_plan_status }}"
            echo "- Apply Executed: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto_apply == 'true' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send completion notification
        id: notify
        uses: ./.github/workflows/send-dl-notification
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ secrets.KEYVAULT_NAME }}
          subject: "UDA Databricks Object Access Completed - ${{ needs.validate_request.outputs.request_id }}"
          body: |
            UDA Databricks Object Access workflow completed.

            Request ID: ${{ needs.validate_request.outputs.request_id }}
            Request File: ${{ needs.validate_request.outputs.request_file }}
            Environment: ${{ needs.validate_request.outputs.environment }}
            Principal: ${{ needs.validate_request.outputs.principal_type }} / ${{ needs.validate_request.outputs.principal_name }}
            Object Count: ${{ needs.validate_request.outputs.object_count }}
            Plan Status: ${{ needs.terraform_plan.outputs.tf_plan_status }}
            Apply Executed: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto_apply == 'true' }}
            Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Add notification status to summary
        run: |
          if [ "${{ steps.notify.outputs.status }}" = "sent" ]; then
            echo "- Notification DL Email: sent from Key Vault to configured distribution list" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Notification DL Email: skipped (missing Key Vault notification secrets)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Archive execution log
        uses: actions/upload-artifact@v4
        with:
          name: uda-execution-log
          path: generated/execution_log.json