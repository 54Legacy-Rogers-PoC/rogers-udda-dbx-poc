name: UDA Databricks Schema Creation

on:
  push:
    branches:
      - main
    paths:
      - "requests/schema-creation/dev/**"
      - "requests/schema-creation/qa/**"
      - "requests/schema-creation/prd/**"
  pull_request:
    branches:
      - main
    paths:
      - "requests/schema-creation/dev/**"
      - "requests/schema-creation/qa/**"
      - "requests/schema-creation/prd/**"
  workflow_dispatch:
    inputs:
      request_file:
        description: Path to a single schema request YAML file
        required: true
        type: string
      request_files:
        description: Optional comma or newline separated schema request YAML paths
        required: false
        default: ""
        type: string
      run_plan:
        description: Run Terraform plan stage
        required: true
        default: true
        type: boolean
      run_apply:
        description: Run Terraform apply stage
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: uda-dbx-schema-creation-global
  cancel-in-progress: false

jobs:
  detect-requests:
    runs-on: ubuntu-latest
    outputs:
      has_requests: ${{ steps.collect.outputs.has_requests }}
      matrix: ${{ steps.collect.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Collect request files
        id: collect
        shell: bash
        env:
          REQUEST_FILE_INPUT: ${{ inputs.request_file }}
          REQUEST_FILES_INPUT: ${{ inputs.request_files }}
          BASE_SHA_EVENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA_EVENT: ${{ github.sha }}
        run: |
          # Keep the workflow focused on orchestration; request discovery lives in a helper script.
          bash uda/scripts/schema-creation/collect_request_files.sh

  plan-schema-creation:
    needs: [detect-requests]
    if: ${{ needs.detect-requests.outputs.has_requests == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_plan) }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && format('schema-creation-{0}-plan', matrix.deployment_environment) || format('schema-creation-{0}', matrix.deployment_environment) }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect-requests.outputs.matrix) }}
    env:
      REQUEST_FILE: ${{ matrix.request_file }}
      DEPLOYMENT_ENVIRONMENT: ${{ matrix.deployment_environment }}
      EXPECTED_ENVIRONMENT_CODE: ${{ matrix.environment_code }}
      REQUESTS_DIRECTORY: requests/schema-creation/${{ matrix.deployment_environment }}
      OUTPUT_ROOT: uda/output/schema-creation
      TF_WORKDIR: ${{ github.workspace }}/terraform/environments/dev
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install workflow dependencies
        run: |
          pip install --only-binary=:all: pyyaml==6.0.2

      - name: Prepare output paths
        id: prep_paths
        shell: bash
        run: |
          request_name="$(basename "$REQUEST_FILE")"
          request_id="${request_name%.*}"
          output_dir="$OUTPUT_ROOT/$request_id"
          mkdir -p "$output_dir"

          echo "OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"
          echo "NORMALIZED_JSON=$output_dir/$request_id.normalized.json" >> "$GITHUB_ENV"
          echo "TFVARS_JSON=$output_dir/$request_id.auto.tfvars.json" >> "$GITHUB_ENV"
          echo "CURRENT_TARGETS_JSON=$output_dir/$request_id.current-targets.json" >> "$GITHUB_ENV"
          echo "TFPLAN_BIN=$output_dir/schema-creation.tfplan" >> "$GITHUB_ENV"
          echo "TFPLAN_TXT=$output_dir/schema-creation-plan.txt" >> "$GITHUB_ENV"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Validate schema request
        run: |
          python uda/scripts/schema-creation/validate_request.py \
            --request-file "$REQUEST_FILE"

      - name: Normalize schema request
        run: |
          python uda/scripts/schema-creation/normalize_request.py \
            --request-file "$REQUEST_FILE" \
            --output-json "$NORMALIZED_JSON"

      - name: Validate deployment environment
        id: environment_config
        run: |
          python uda/scripts/schema-creation/validate_environment_config.py \
            --request-json "$NORMALIZED_JSON" \
            --expected-environment "$EXPECTED_ENVIRONMENT_CODE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup Azure and Databricks
        uses: ./.github/workflows/setup-dbxtf-env
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ steps.environment_config.outputs.keyvault_name }}
          databricks_host_secret_name: ${{ steps.environment_config.outputs.databricks_host_secret_name }}
          databricks_client_id_secret_name: ${{ steps.environment_config.outputs.databricks_client_id_secret_name }}
          databricks_client_secret_secret_name: ${{ steps.environment_config.outputs.databricks_client_secret_secret_name }}
          databricks_tenant_id_secret_name: ${{ steps.environment_config.outputs.databricks_tenant_id_secret_name }}
          databricks_workspace_resource_id_secret_name: ${{ steps.environment_config.outputs.databricks_workspace_resource_id_secret_name }}
          tfstate_resource_group_secret_name: ${{ steps.environment_config.outputs.tfstate_resource_group_secret_name }}
          tfstate_storage_account_secret_name: ${{ steps.environment_config.outputs.tfstate_storage_account_secret_name }}
          tfstate_container_secret_name: ${{ steps.environment_config.outputs.tfstate_container_secret_name }}
          tfstate_key_secret_name: ${{ steps.environment_config.outputs.tfstate_key_secret_name }}
          tfstate_key_suffix: ${{ matrix.tfstate_key_suffix }}

      - name: Generate shared-state tfvars
        shell: bash
        run: |
          set -euo pipefail
          existing_ids_file="$OUTPUT_DIR/existing-schema-request-ids.txt"
          terraform -chdir="$TF_WORKDIR" state list | python -c \
            'import re,sys; ids={match.group(1) for line in sys.stdin for match in [re.match(r"^module\.schema_creation\[\"([^\"]+)\"\]\.", line)] if match}; print("\n".join(sorted(ids)))' \
            > "$existing_ids_file"

          python uda/scripts/schema-creation/generate_tfvars.py \
            --input-json "$NORMALIZED_JSON" \
            --output-json "$TFVARS_JSON" \
            --current-targets-json "$CURRENT_TARGETS_JSON" \
            --existing-request-ids-file "$existing_ids_file" \
            --requests-directory "$REQUESTS_DIRECTORY" \
            --terraform-variables-file terraform/environments/dev/variables.tf

      - name: Build request Terraform targets
        shell: bash
        run: |
          set -euo pipefail
          targets_file="$OUTPUT_DIR/schema-terraform-targets.txt"
          jq -r 'keys[] | "module.schema_creation[\"" + . + "\"]"' \
            "$CURRENT_TARGETS_JSON" > "$targets_file"

          jq -r '
            [.[] | select(.target_type == "communitymart") |
             ((.target_catalog | ascii_downcase) + "|" + (.ad_group_name | ascii_downcase))] |
            unique[] |
            "databricks_grant.communitymart_ad_group_catalog[\"" + . + "\"]"
          ' "$CURRENT_TARGETS_JSON" >> "$targets_file"

          if [ ! -s "$targets_file" ]; then
            echo "No Terraform targets were generated for $REQUEST_FILE." >&2
            exit 1
          fi

          echo "Terraform will operate only on:"
          cat "$targets_file"

      - name: Terraform plan
        shell: bash
        run: |
          set -euo pipefail
          target_args=()
          while IFS= read -r address; do
            [ -z "$address" ] && continue
            target_args+=("-target=$address")
          done < "$OUTPUT_DIR/schema-terraform-targets.txt"

          terraform -chdir="$TF_WORKDIR" plan \
            -lock-timeout=10m \
            -var-file="$GITHUB_WORKSPACE/$TFVARS_JSON" \
            "${target_args[@]}" \
            -out="$GITHUB_WORKSPACE/$TFPLAN_BIN"

          terraform -chdir="$TF_WORKDIR" show -no-color "$GITHUB_WORKSPACE/$TFPLAN_BIN" > "$TFPLAN_TXT"

      - name: Enforce create-or-update-only plan
        shell: bash
        run: |
          set -euo pipefail
          PLAN_JSON="$OUTPUT_DIR/schema-creation-plan.json"
          terraform -chdir="$TF_WORKDIR" show -json "$GITHUB_WORKSPACE/$TFPLAN_BIN" > "$PLAN_JSON"

          python - "$PLAN_JSON" "$OUTPUT_DIR/schema-terraform-targets.txt" <<'PY'
          import json
          import sys

          plan_path, targets_path = sys.argv[1:]
          with open(plan_path, encoding="utf-8") as handle:
            plan = json.load(handle)
          with open(targets_path, encoding="utf-8") as handle:
            targets = [line.strip() for line in handle if line.strip()]

          unexpected = sorted(
            change["address"]
            for change in plan.get("resource_changes", [])
            if not any(
              change["address"] == target or change["address"].startswith(f"{target}.")
              for target in targets
            )
          )
          if unexpected:
            print("Plan contains changes outside the current request targets:", file=sys.stderr)
            print("\n".join(unexpected), file=sys.stderr)
            raise SystemExit(1)
          PY

          removal_count="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$PLAN_JSON")"
          echo "Plan removal/replacement action count: $removal_count"

          if [ "$removal_count" -gt 0 ]; then
            echo "Plan rejected: schema creation supports create and in-place update actions only." >&2
            exit 1
          fi

      - name: Terraform apply
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_plan && inputs.run_apply) }}
        run: |
          terraform -chdir="$TF_WORKDIR" apply -lock-timeout=10m -auto-approve "$GITHUB_WORKSPACE/$TFPLAN_BIN"

      - name: Publish plan outputs
        if: ${{ always() && steps.prep_paths.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uda-dbx-schema-creation-plan-output-${{ steps.prep_paths.outputs.request_id }}
          path: |
            ${{ steps.prep_paths.outputs.output_dir }}
            !${{ steps.prep_paths.outputs.output_dir }}/schema-creation.tfplan
          if-no-files-found: warn

      - name: Write plan summary
        if: always()
        run: |
          {
            echo "## Schema Creation Plan Result"
            echo "- Request file: $REQUEST_FILE"
            echo "- Environment: $DEPLOYMENT_ENVIRONMENT"
            echo "- Output dir: $OUTPUT_DIR"
            echo "- Plan text: $TFPLAN_TXT"
            echo "- Backend key: $TF_BACKEND_KEY"
          } >> "$GITHUB_STEP_SUMMARY"

  post-validate-schema-creation:
    needs: [detect-requests, plan-schema-creation]
    if: ${{ needs.plan-schema-creation.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_plan && inputs.run_apply)) }}
    runs-on: ubuntu-latest
    environment: ${{ format('schema-creation-{0}', matrix.deployment_environment) }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect-requests.outputs.matrix) }}

    env:
      REQUEST_FILE: ${{ matrix.request_file }}
      DEPLOYMENT_ENVIRONMENT: ${{ matrix.deployment_environment }}
      EXPECTED_ENVIRONMENT_CODE: ${{ matrix.environment_code }}
      OUTPUT_ROOT: uda/output/schema-creation
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install workflow dependencies
        run: |
          pip install --only-binary=:all: pyyaml==6.0.2 requests==2.32.3

      - name: Prepare post-validation path
        id: post_paths
        shell: bash
        run: |
          request_name="$(basename "$REQUEST_FILE")"
          request_id="${request_name%.*}"
          output_dir="$OUTPUT_ROOT/$request_id"
          mkdir -p "$output_dir"
          echo "OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"
          echo "NORMALIZED_JSON=$output_dir/$request_id.normalized.json" >> "$GITHUB_ENV"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Normalize request for live validation
        run: |
          python uda/scripts/schema-creation/normalize_request.py \
            --request-file "$REQUEST_FILE" \
            --output-json "$NORMALIZED_JSON"

      - name: Validate deployment environment
        id: environment_config
        run: |
          python uda/scripts/schema-creation/validate_environment_config.py \
            --request-json "$NORMALIZED_JSON" \
            --expected-environment "$EXPECTED_ENVIRONMENT_CODE" \
            --github-output "$GITHUB_OUTPUT"

      - name: Setup Azure and Databricks
        uses: ./.github/workflows/setup-dbxtf-env
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ steps.environment_config.outputs.keyvault_name }}
          databricks_host_secret_name: ${{ steps.environment_config.outputs.databricks_host_secret_name }}
          databricks_client_id_secret_name: ${{ steps.environment_config.outputs.databricks_client_id_secret_name }}
          databricks_client_secret_secret_name: ${{ steps.environment_config.outputs.databricks_client_secret_secret_name }}
          databricks_tenant_id_secret_name: ${{ steps.environment_config.outputs.databricks_tenant_id_secret_name }}
          databricks_workspace_resource_id_secret_name: ${{ steps.environment_config.outputs.databricks_workspace_resource_id_secret_name }}
          tfstate_resource_group_secret_name: ${{ steps.environment_config.outputs.tfstate_resource_group_secret_name }}
          tfstate_storage_account_secret_name: ${{ steps.environment_config.outputs.tfstate_storage_account_secret_name }}
          tfstate_container_secret_name: ${{ steps.environment_config.outputs.tfstate_container_secret_name }}
          tfstate_key_secret_name: ${{ steps.environment_config.outputs.tfstate_key_secret_name }}
          tfstate_key_suffix: ${{ matrix.tfstate_key_suffix }}

      - name: Validate live Databricks schema state
        shell: bash
        run: |
          python "$GITHUB_WORKSPACE/uda/scripts/schema-creation/validate_live_schema.py" \
            --request-json "$NORMALIZED_JSON" \
            --databricks-host "$DATABRICKS_HOST" \
            --output-json "$OUTPUT_DIR/schema-creation-status.json"

      - name: Publish validation outputs
        if: ${{ always() && steps.post_paths.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uda-dbx-schema-creation-validation-${{ steps.post_paths.outputs.request_id }}
          path: ${{ steps.post_paths.outputs.output_dir }}
          if-no-files-found: warn

      - name: Write validation summary
        if: always()
        run: |
          {
            echo "## Post Validation Result"
            echo "- Request file: $REQUEST_FILE"
            echo "- Environment: $DEPLOYMENT_ENVIRONMENT"
            echo "- Output dir: $OUTPUT_DIR"
            echo "- Host: $DATABRICKS_HOST"
          } >> "$GITHUB_STEP_SUMMARY"

