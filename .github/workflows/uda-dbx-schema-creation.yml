name: UDA Databricks Schema Creation

on:
  push:
    branches:
      - feature/furqan-udda
    paths:
      - "uda/templates/schema-creation/**"
  pull_request:
    branches:
      - feature/furqan-udda
    paths:
      - "uda/templates/schema-creation/**"
  workflow_dispatch:
    inputs:
      request_file:
        description: Path to a single schema request YAML file
        required: true
        type: string
      request_files:
        description: Optional comma or newline separated schema request YAML paths
        required: false
        default: ""
        type: string
      run_plan:
        description: Run Terraform plan stage
        required: true
        default: true
        type: boolean
      run_apply:
        description: Run Terraform apply stage
        required: true
        default: false
        type: boolean
      allow_destroy:
        description: Allow delete/replace actions in Terraform apply
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: uda-dbx-schema-creation-global
  cancel-in-progress: false

jobs:
  detect-requests:
    runs-on: ubuntu-latest
    outputs:
      has_requests: ${{ steps.collect.outputs.has_requests }}
      matrix: ${{ steps.collect.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Collect request files
        id: collect
        shell: bash
        env:
          REQUEST_FILE_INPUT: ${{ inputs.request_file }}
          REQUEST_FILES_INPUT: ${{ inputs.request_files }}
          BASE_SHA_EVENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA_EVENT: ${{ github.sha }}
        run: |
          set -euo pipefail

          normalize_path() {
            local p="$1"
            p="${p#./}"
            printf '%s' "$p"
          }

          add_request() {
            local p
            p="$(normalize_path "$1")"
            [ -z "$p" ] && return 0
            [[ "$p" == uda/templates/schema-creation/*.yml || "$p" == uda/templates/schema-creation/*.yaml ]] || return 0
            REQUESTS+=("$p")
          }

          REQUESTS=()

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            add_request "${REQUEST_FILE_INPUT:-}"

            if [ -n "${REQUEST_FILES_INPUT:-}" ]; then
              while IFS= read -r raw; do
                raw="${raw//,/ }"
                for candidate in $raw; do
                  add_request "$candidate"
                done
              done <<< "${REQUEST_FILES_INPUT}"
            fi
          else
            if [ -n "${BASE_SHA_EVENT:-}" ] && [ -n "${HEAD_SHA_EVENT:-}" ]; then
              while IFS= read -r changed; do
                add_request "$changed"
              done < <(git diff --name-only --diff-filter=A "$BASE_SHA_EVENT" "$HEAD_SHA_EVENT" || true)
            fi
          fi

          if [ "${#REQUESTS[@]}" -eq 0 ]; then
            echo "has_requests=false" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "No newly added schema request files found."
            exit 0
          fi

          declare -A seen=()
          DEDUPED=()
          for rf in "${REQUESTS[@]}"; do
            if [ -z "${seen[$rf]:-}" ]; then
              seen[$rf]=1
              DEDUPED+=("$rf")
            fi
          done

          for rf in "${DEDUPED[@]}"; do
            if [ ! -f "$rf" ]; then
              echo "Request file not found: $rf" >&2
              exit 1
            fi
          done

          matrix_json="{\"include\":["
          first=true
          for rf in "${DEDUPED[@]}"; do
            if [ "$first" = true ]; then
              first=false
            else
              matrix_json+=","
            fi
            escaped="${rf//\"/\\\"}"
            matrix_json+="{\"request_file\":\"$escaped\"}"
          done
          matrix_json+="]}"

          echo "has_requests=true" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  plan-schema-creation:
    needs: [detect-requests]
    if: ${{ needs.detect-requests.outputs.has_requests == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_plan) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect-requests.outputs.matrix) }}
    env:
      REQUEST_FILE: ${{ matrix.request_file }}
      OUTPUT_ROOT: uda/output/schema-creation
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Azure login
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          creds: |
            {
              "clientId":"${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId":"${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Load Databricks secrets from Key Vault
        shell: bash
        env:
          KEYVAULT_NAME: ${{ secrets.KEYVAULT_NAME }}
        run: |
          KV="$KEYVAULT_NAME"

          get_kv_secret() {
            local out_var="$1"
            local secret_name="$2"
            local value
            value="$(az keyvault secret show --vault-name "$KV" --name "$secret_name" --query value -o tsv 2>/dev/null | tr -d '\r' || true)"
            if [ -z "$value" ]; then
              echo "Missing Key Vault secret: $secret_name" >&2
              exit 1
            fi
            printf -v "$out_var" '%s' "$value"
          }

          get_kv_secret_fallback() {
            local out_var="$1"
            shift
            local names=("$@")
            local value=""
            for secret_name in "${names[@]}"; do
              value="$(az keyvault secret show --vault-name "$KV" --name "$secret_name" --query value -o tsv 2>/dev/null | tr -d '\r' || true)"
              if [ -n "$value" ]; then
                printf -v "$out_var" '%s' "$value"
                return 0
              fi
            done
            echo "Missing Key Vault secret. Tried names: ${names[*]}" >&2
            exit 1
          }

          get_kv_secret DATABRICKS_HOST_RAW DATABRICKS-HOST
          DATABRICKS_HOST_VALUE="$(echo "$DATABRICKS_HOST_RAW" | sed -E 's#^(https://[^/]+).*$#\1#' | sed 's#/$##')"
          get_kv_secret DATABRICKS_CLIENT_ID_VALUE DB-CLIENT-ID
          get_kv_secret DATABRICKS_CLIENT_SECRET_VALUE DB-CLIENT-SECRET
          get_kv_secret DATABRICKS_TENANT_ID_VALUE DB-TENANT-ID
          get_kv_secret TFSTATE_RESOURCE_GROUP_VALUE TFSTATE-RESOURCE-GROUP
          get_kv_secret TFSTATE_STORAGE_ACCOUNT_VALUE TFSTATE-STORAGE-ACCOUNT
          get_kv_secret TFSTATE_CONTAINER_VALUE TFSTATE-CONTAINER-DBX-UDA
          get_kv_secret_fallback TFSTATE_ACCESS_KEY_VALUE TFSTATE-STORAGE-ACCESS-KEY TFSTATE-ACCESS-KEY TFSTATE-STORAGE-KEY STORAGE-ACCOUNT-KEY
          TFSTATE_KEY_EFFECTIVE="schema-creation/default.tfstate"

          for v in DATABRICKS_HOST_VALUE DATABRICKS_CLIENT_ID_VALUE DATABRICKS_CLIENT_SECRET_VALUE DATABRICKS_TENANT_ID_VALUE TFSTATE_RESOURCE_GROUP_VALUE TFSTATE_STORAGE_ACCOUNT_VALUE TFSTATE_CONTAINER_VALUE TFSTATE_ACCESS_KEY_VALUE; do
            if [ -z "${!v}" ]; then
              echo "Missing or empty secret value for $v from Key Vault $KV" >&2
              exit 1
            fi
          done

          echo "::add-mask::$DATABRICKS_CLIENT_SECRET_VALUE"
          echo "::add-mask::$TFSTATE_ACCESS_KEY_VALUE"

          echo "TF_VAR_databricks_host=$DATABRICKS_HOST_VALUE" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_id=$DATABRICKS_CLIENT_ID_VALUE" >> "$GITHUB_ENV"
          echo "TF_VAR_databricks_client_secret=$DATABRICKS_CLIENT_SECRET_VALUE" >> "$GITHUB_ENV"

          echo "TF_BACKEND_RESOURCE_GROUP_NAME=$TFSTATE_RESOURCE_GROUP_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_STORAGE_ACCOUNT_NAME=$TFSTATE_STORAGE_ACCOUNT_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_CONTAINER_NAME=$TFSTATE_CONTAINER_VALUE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_KEY=$TFSTATE_KEY_EFFECTIVE" >> "$GITHUB_ENV"
          echo "TF_BACKEND_ACCESS_KEY=$TFSTATE_ACCESS_KEY_VALUE" >> "$GITHUB_ENV"

          echo "DATABRICKS_HOST=$DATABRICKS_HOST_VALUE" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_ID=$DATABRICKS_CLIENT_ID_VALUE" >> "$GITHUB_ENV"
          echo "DATABRICKS_CLIENT_SECRET=$DATABRICKS_CLIENT_SECRET_VALUE" >> "$GITHUB_ENV"

          echo "Using default backend key (will be overridden after normalization): $TFSTATE_KEY_EFFECTIVE"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Install workflow dependencies
        run: |
          pip install --only-binary=:all: pyyaml==6.0.2

      - name: Prepare output paths
        id: prep_paths
        shell: bash
        run: |
          request_name="$(basename "$REQUEST_FILE")"
          request_id="${request_name%.*}"
          output_dir="$OUTPUT_ROOT/$request_id"
          mkdir -p "$output_dir"

          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"
          echo "NORMALIZED_JSON=$output_dir/$request_id.normalized.json" >> "$GITHUB_ENV"
          echo "TFVARS_JSON=$output_dir/$request_id.auto.tfvars.json" >> "$GITHUB_ENV"
          echo "TFPLAN_BIN=$output_dir/schema-creation.tfplan" >> "$GITHUB_ENV"
          echo "TFPLAN_TXT=$output_dir/schema-creation-plan.txt" >> "$GITHUB_ENV"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Validate schema request
        run: |
          python uda/scripts/schema-creation/validate_request.py \
            --request-file "$REQUEST_FILE"

      - name: Normalize schema request
        run: |
          python uda/scripts/schema-creation/normalize_request.py \
            --request-file "$REQUEST_FILE" \
            --output-json "$NORMALIZED_JSON"

      - name: Compute backend key from normalized request
        shell: bash
        run: |
          key_parts="$(python -c "import json,re,os; p=json.load(open(os.environ['NORMALIZED_JSON'],'r',encoding='utf-8')); s=lambda v: re.sub(r'[^A-Za-z0-9._-]','-',str(v or '').strip()); print(f'{s((p.get(\"environment\") or \"\").upper())}/{s(p.get(\"request_id\"))}-{s(p.get(\"communitymart_schema_name\") or \"na\")}-{s(p.get(\"sandbox_schema_name\") or \"na\")}')")"

          TFSTATE_KEY_EFFECTIVE="schema-creation/${key_parts}.tfstate"
          echo "TF_BACKEND_KEY=$TFSTATE_KEY_EFFECTIVE" >> "$GITHUB_ENV"
          echo "Using computed backend key: $TFSTATE_KEY_EFFECTIVE"

      - name: Ensure sandbox ADLS container exists
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_apply) }}
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail

          sandbox_mode="$(python -c "import json,os; p=json.load(open(os.environ['NORMALIZED_JSON'],'r',encoding='utf-8')); print((p.get('sandbox_mode') or '').strip().lower())")"
          if [ "$sandbox_mode" != "new" ]; then
            echo "Sandbox mode is not new; skipping container check/create."
            exit 0
          fi

          sandbox_schema_name="$(python -c "import json,os; p=json.load(open(os.environ['NORMALIZED_JSON'],'r',encoding='utf-8')); print((p.get('sandbox_schema_name') or '').strip().lower())")"
          if [ -z "$sandbox_schema_name" ]; then
            echo "sandbox_schema_name is required to derive sandbox container." >&2
            exit 1
          fi

          environment_code="$(python -c "import json,os; p=json.load(open(os.environ['NORMALIZED_JSON'],'r',encoding='utf-8')); print((p.get('environment') or '').strip().upper())")"
          case "$environment_code" in
            PRD)
              sandbox_storage_account="mazcacprdedlbidls01"
              ;;
            *)
              sandbox_storage_account="stadbdev"
              ;;
          esac

          sandbox_container_suffix="$(SCHEMA="$sandbox_schema_name" python -c "import os; n=os.environ['SCHEMA']; p=[x for x in n.split('_') if x]; print('-'.join(p[1:-1]) if len(p)>2 else n.replace('_','-'))")"
          sandbox_container="sandbox-${sandbox_container_suffix}"

          echo "Checking ADLS container: ${sandbox_container}"
          set +e
          exists="$(az storage container exists \
            --account-name "$sandbox_storage_account" \
            --name "$sandbox_container" \
            --auth-mode login \
            --query exists -o tsv 2>/tmp/sandbox_container_exists.err)"
          exists_rc=$?
          set -e

          if [ "$exists_rc" -eq 0 ]; then
            if [ "$exists" = "true" ]; then
              echo "ADLS container already exists: ${sandbox_container}"
              exit 0
            fi

            echo "Creating ADLS container via data-plane: ${sandbox_container}"
            az storage container create \
              --account-name "$sandbox_storage_account" \
              --name "$sandbox_container" \
              --auth-mode login \
              --output none

            echo "ADLS container created via data-plane: ${sandbox_container}"
            exit 0
          fi

          echo "Data-plane check failed for ${sandbox_storage_account}/${sandbox_container}; falling back to ARM container ensure."
          cat /tmp/sandbox_container_exists.err >&2 || true

          storage_resource_group="$(az storage account show --name "$sandbox_storage_account" --query resourceGroup -o tsv)"
          if [ -z "$storage_resource_group" ]; then
            echo "Unable to resolve resource group for storage account $sandbox_storage_account." >&2
            exit 1
          fi

          az rest \
            --method put \
            --url "https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${storage_resource_group}/providers/Microsoft.Storage/storageAccounts/${sandbox_storage_account}/blobServices/default/containers/${sandbox_container}?api-version=2023-05-01" \
            --headers "Content-Type=application/json" \
            --body '{"properties":{}}' \
            --output none

          echo "ADLS container ensured via ARM: ${sandbox_container}"

      - name: Generate tfvars JSON
        run: |
          python uda/scripts/schema-creation/generate_tfvars.py \
            --input-json "$NORMALIZED_JSON" \
            --output-json "$TFVARS_JSON" \
            --terraform-variables-file terraform/schema_creation/variables.tf

      - name: Terraform init (with retry)
        shell: bash
        run: |
          if [ -z "${TF_BACKEND_ACCESS_KEY:-}" ]; then
            echo "TF_BACKEND_ACCESS_KEY is empty; cannot initialize Terraform backend." >&2
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Terraform init attempt $attempt/3"
            if terraform -chdir=terraform/schema_creation init \
              -backend-config="resource_group_name=$TF_BACKEND_RESOURCE_GROUP_NAME" \
              -backend-config="storage_account_name=$TF_BACKEND_STORAGE_ACCOUNT_NAME" \
              -backend-config="container_name=$TF_BACKEND_CONTAINER_NAME" \
              -backend-config="key=$TF_BACKEND_KEY" \
              -backend-config="use_azuread_auth=false" \
              -backend-config="access_key=$TF_BACKEND_ACCESS_KEY"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "terraform init failed after 3 attempts" >&2
          exit 1

      - name: Terraform plan
        run: |
          terraform -chdir=terraform/schema_creation plan \
            -lock-timeout=10m \
            -var-file="../../$TFVARS_JSON" \
            -out="../../$TFPLAN_BIN"

          terraform -chdir=terraform/schema_creation show -no-color "../../$TFPLAN_BIN" > "$TFPLAN_TXT"

      - name: Block destructive plan unless explicitly allowed
        shell: bash
        env:
          ALLOW_DESTROY: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_destroy || 'false' }}
        run: |
          PLAN_JSON="$OUTPUT_DIR/schema-creation-plan.json"
          terraform -chdir=terraform/schema_creation show -json "../../$TFPLAN_BIN" > "$PLAN_JSON"

          destroy_count="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$PLAN_JSON")"
          echo "Plan delete/replace action count: $destroy_count"

          if [ "$destroy_count" -gt 0 ] && [ "${ALLOW_DESTROY,,}" != "true" ]; then
            echo "Destructive Terraform actions detected (delete/replace)." >&2
            echo "Set workflow_dispatch input allow_destroy=true to permit apply for this run." >&2
            exit 1
          fi

      - name: Ensure sandbox external location exists before apply
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_plan && inputs.run_apply) }}
        shell: bash
        run: |
          set -euo pipefail

          sandbox_mode="$(python -c "import json,os; p=json.load(open(os.environ['NORMALIZED_JSON'],'r',encoding='utf-8')); print((p.get('sandbox_mode') or '').strip().lower())")"
          if [ "$sandbox_mode" != "new" ]; then
            echo "Sandbox mode is not new; skipping external location ensure."
            exit 0
          fi

          sandbox_schema_name="$(python -c "import json,os; p=json.load(open(os.environ['NORMALIZED_JSON'],'r',encoding='utf-8')); print((p.get('sandbox_schema_name') or '').strip().lower())")"
          if [ -z "$sandbox_schema_name" ]; then
            echo "sandbox_schema_name is required to derive sandbox external location." >&2
            exit 1
          fi

          environment_code="$(python -c "import json,os; p=json.load(open(os.environ['NORMALIZED_JSON'],'r',encoding='utf-8')); print((p.get('environment') or '').strip().upper())")"
          case "$environment_code" in
            PRD)
              environment_label="dev"
              sandbox_storage_account="stadbdev"
              sandbox_storage_host="${sandbox_storage_account}.dfs.core.windows.net"
              storage_credential_name="adb-dev-cred"
              ;;
            QA)
              environment_label="qa"
              sandbox_storage_account="stadbdev"
              sandbox_storage_host="${sandbox_storage_account}.dfs.core.windows.net"
              storage_credential_name="adb-dev-cred"
              ;;
            *)
              environment_label="dev"
              sandbox_storage_account="stadbdev"
              sandbox_storage_host="${sandbox_storage_account}.dfs.core.windows.net"
              storage_credential_name="adb-dev-cred"
              ;;
          esac

          sandbox_container_suffix="$(SCHEMA="$sandbox_schema_name" python -c "import os; n=os.environ['SCHEMA']; p=[x for x in n.split('_') if x]; print('-'.join(p[1:-1]) if len(p)>2 else n.replace('_','-'))")"
          sandbox_container="sandbox-${sandbox_container_suffix}"
          sandbox_external_location_name="el_${environment_label}__${sandbox_container}__at__${sandbox_storage_account}__rw"
          sandbox_external_location_url="abfss://${sandbox_container}@${sandbox_storage_host}/"
          sandbox_external_location_owner="furqan@54legacy.com"

          token_response="$(curl -sS -X POST "$DATABRICKS_HOST/oidc/v1/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$DATABRICKS_CLIENT_ID" \
            --data-urlencode "client_secret=$DATABRICKS_CLIENT_SECRET" \
            --data-urlencode "scope=all-apis")"

          dbx_token="$(echo "$token_response" | jq -r '.access_token // empty')"
          if [ -z "$dbx_token" ]; then
            echo "Failed to acquire Databricks OAuth token for external location ensure." >&2
            echo "$token_response" >&2
            exit 1
          fi

          lookup_status="$(curl -sS -o /tmp/sandbox_location.json -w '%{http_code}' \
            -H "Authorization: Bearer $dbx_token" \
            "$DATABRICKS_HOST/api/2.1/unity-catalog/external-locations/$sandbox_external_location_name")"

          if [ "$lookup_status" -eq 200 ]; then
            existing_url="$(jq -r '.url // empty' /tmp/sandbox_location.json)"
            existing_owner="$(jq -r '.owner // empty' /tmp/sandbox_location.json)"
            if [ "$existing_url" != "$sandbox_external_location_url" ]; then
              echo "External location $sandbox_external_location_name exists but URL differs." >&2
              echo "Existing: $existing_url" >&2
              echo "Expected: $sandbox_external_location_url" >&2
              exit 1
            fi
            if [ -n "$existing_owner" ] && [ "$existing_owner" != "$sandbox_external_location_owner" ]; then
              echo "External location owner differs from expected owner." >&2
              echo "Existing owner: $existing_owner" >&2
              echo "Expected owner: $sandbox_external_location_owner" >&2
              exit 1
            fi
            echo "Reusing external location: $sandbox_external_location_name"
            exit 0
          fi

          if [ "$lookup_status" -ne 404 ]; then
            echo "Failed to query external location $sandbox_external_location_name (status: $lookup_status)." >&2
            cat /tmp/sandbox_location.json >&2 || true
            exit 1
          fi

          payload="$(jq -cn \
            --arg name "$sandbox_external_location_name" \
            --arg url "$sandbox_external_location_url" \
            --arg cred "$storage_credential_name" \
            --arg owner "$sandbox_external_location_owner" \
            '{name:$name,url:$url,credential_name:$cred,owner:$owner,read_only:false,comment:"Auto-created by UDA schema workflow"}')"

          create_status="$(curl -sS -o /tmp/create_sandbox_location.json -w '%{http_code}' \
            -X POST "$DATABRICKS_HOST/api/2.1/unity-catalog/external-locations" \
            -H "Authorization: Bearer $dbx_token" \
            -H "Content-Type: application/json" \
            -d "$payload")"

          if [ "$create_status" -ge 400 ]; then
            echo "Failed to create external location $sandbox_external_location_name (status: $create_status)." >&2
            cat /tmp/create_sandbox_location.json >&2 || true
            exit 1
          fi

          echo "Created external location: $sandbox_external_location_name"

      - name: Terraform apply
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_plan && inputs.run_apply) }}
        run: |
          terraform -chdir=terraform/schema_creation apply -lock-timeout=10m -auto-approve "../../$TFPLAN_BIN"

      - name: Publish plan outputs
        if: ${{ always() && steps.prep_paths.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uda-dbx-schema-creation-plan-output-${{ steps.prep_paths.outputs.request_id }}
          path: ${{ steps.prep_paths.outputs.output_dir }}
          if-no-files-found: warn

      - name: Write plan summary
        if: always()
        run: |
          {
            echo "## Schema Creation Plan Result"
            echo "- Request file: $REQUEST_FILE"
            echo "- Output dir: $OUTPUT_DIR"
            echo "- Plan text: $TFPLAN_TXT"
            echo "- Backend key: $TF_BACKEND_KEY"
          } >> "$GITHUB_STEP_SUMMARY"
