name: UDA Databricks Schema Creation

on:
  push:
    branches:
      - main
    paths:
      - "requests/schema-creation/dev/**"
  pull_request:
    branches:
      - main
    paths:
      - "requests/schema-creation/dev/**"
  workflow_dispatch:
    inputs:
      request_file:
        description: Path to a single schema request YAML file
        required: true
        type: string
      request_files:
        description: Optional comma or newline separated schema request YAML paths
        required: false
        default: ""
        type: string
      run_plan:
        description: Run Terraform plan stage
        required: true
        default: true
        type: boolean
      run_apply:
        description: Run Terraform apply stage
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: uda-dbx-schema-creation-global
  cancel-in-progress: false

jobs:
  detect-requests:
    runs-on: ubuntu-latest
    outputs:
      has_requests: ${{ steps.collect.outputs.has_requests }}
      matrix: ${{ steps.collect.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Collect request files
        id: collect
        shell: bash
        env:
          REQUEST_FILE_INPUT: ${{ inputs.request_file }}
          REQUEST_FILES_INPUT: ${{ inputs.request_files }}
          BASE_SHA_EVENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA_EVENT: ${{ github.sha }}
        run: |
          # Keep the workflow focused on orchestration; request discovery lives in a helper script.
          bash uda/scripts/schema-creation/collect_request_files.sh

  plan-schema-creation:
    needs: [detect-requests]
    if: ${{ needs.detect-requests.outputs.has_requests == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_plan) }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'schema-creation-plan' || 'schema-creation-production' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect-requests.outputs.matrix) }}
    env:
      REQUEST_FILE: ${{ matrix.request_file }}
      OUTPUT_ROOT: uda/output/schema-creation
      TF_WORKDIR: ${{ github.workspace }}/terraform/environments/dev
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install workflow dependencies
        run: |
          pip install --only-binary=:all: pyyaml==6.0.2

      - name: Prepare output paths
        id: prep_paths
        shell: bash
        run: |
          request_name="$(basename "$REQUEST_FILE")"
          request_id="${request_name%.*}"
          output_dir="$OUTPUT_ROOT/$request_id"
          mkdir -p "$output_dir"

          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"
          echo "NORMALIZED_JSON=$output_dir/$request_id.normalized.json" >> "$GITHUB_ENV"
          echo "TFVARS_JSON=$output_dir/$request_id.auto.tfvars.json" >> "$GITHUB_ENV"
          echo "TFPLAN_BIN=$output_dir/schema-creation.tfplan" >> "$GITHUB_ENV"
          echo "TFPLAN_TXT=$output_dir/schema-creation-plan.txt" >> "$GITHUB_ENV"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Validate schema request
        run: |
          python uda/scripts/schema-creation/validate_request.py \
            --request-file "$REQUEST_FILE"

      - name: Normalize schema request
        run: |
          python uda/scripts/schema-creation/normalize_request.py \
            --request-file "$REQUEST_FILE" \
            --output-json "$NORMALIZED_JSON"

      - name: Validate deployment environment
        run: |
          python uda/scripts/schema-creation/validate_environment_config.py \
            --request-json "$NORMALIZED_JSON"

      - name: Setup Azure and Databricks
        uses: ./.github/workflows/setup-dbxtf-env
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ secrets.KEYVAULT_NAME }}
          tfstate_key_suffix: schema-creation

      - name: Back up Terraform state before migration
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_apply) }}
        shell: bash
        run: |
          terraform -chdir="$TF_WORKDIR" state pull > "$OUTPUT_DIR/pre-migration-state.json"

      - name: Migrate legacy schema state address
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_apply) }}
        shell: bash
        run: |
          set -euo pipefail
          legacy_address='module.schema_creation[0]'
          if terraform -chdir="$TF_WORKDIR" state list | grep -Fq "$legacy_address."; then
            legacy_request_id="$(terraform -chdir="$TF_WORKDIR" output -raw request_id)"
            if [ -z "$legacy_request_id" ]; then
              echo "Cannot migrate $legacy_address because the legacy request_id output is empty." >&2
              exit 1
            fi
            destination="module.schema_creation[\"$legacy_request_id\"]"
            echo "Migrating $legacy_address to $destination"
            terraform -chdir="$TF_WORKDIR" state mv "$legacy_address" "$destination"
          else
            echo "Legacy schema module address is not present; migration is not required."
          fi

      - name: Generate shared-state tfvars
        shell: bash
        run: |
          set -euo pipefail
          existing_ids_file="$OUTPUT_DIR/existing-schema-request-ids.txt"
          state_addresses_file="$OUTPUT_DIR/schema-state-addresses.txt"
          terraform -chdir="$TF_WORKDIR" state list | tee "$state_addresses_file" | python -c \
            'import re,sys; ids={match.group(1) for line in sys.stdin for match in [re.match(r"^module\.schema_creation\[\"([^\"]+)\"\]\.", line)] if match}; print("\n".join(sorted(ids)))' \
            > "$existing_ids_file"

          python uda/scripts/schema-creation/generate_tfvars.py \
            --input-json "$NORMALIZED_JSON" \
            --output-json "$TFVARS_JSON" \
            --existing-request-ids-file "$existing_ids_file" \
            --requests-directory requests/schema-creation \
            --orphaned-state-keys-file "$OUTPUT_DIR/orphaned-schema-state-keys.txt" \
            --terraform-variables-file terraform/environments/dev/variables.tf

      - name: Forget state for deleted request sources
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_apply) }}
        shell: bash
        run: |
          set -euo pipefail
          orphaned_keys_file="$OUTPUT_DIR/orphaned-schema-state-keys.txt"
          while IFS= read -r state_key; do
            [ -z "$state_key" ] && continue
            address="module.schema_creation[\"$state_key\"]"
            echo "Forgetting $address from Terraform state; remote Databricks resources are unchanged."
            terraform -chdir="$TF_WORKDIR" state rm "$address"
          done < "$orphaned_keys_file"

      - name: Migrate shared community mart catalog grants
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_apply) }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r legacy_address; do
            state_values="$(terraform -chdir="$TF_WORKDIR" state show -no-color "$legacy_address")"
            catalog="$(printf '%s\n' "$state_values" | sed -n 's/^ *catalog *= *"\([^"]*\)".*/\1/p' | head -n 1)"
            principal="$(printf '%s\n' "$state_values" | sed -n 's/^ *principal *= *"\([^"]*\)".*/\1/p' | head -n 1)"

            if [ -z "$catalog" ] || [ -z "$principal" ]; then
              echo "Cannot read catalog grant identity from $legacy_address" >&2
              exit 1
            fi

            key="${catalog,,}|${principal,,}"
            canonical_address="databricks_grant.communitymart_ad_group_catalog[\"$key\"]"
            if terraform -chdir="$TF_WORKDIR" state list | grep -Fxq "$canonical_address"; then
              legacy_id="$(printf '%s\n' "$state_values" | sed -n 's/^ *id *= *"\([^"]*\)".*/\1/p' | head -n 1)"
              canonical_values="$(terraform -chdir="$TF_WORKDIR" state show -no-color "$canonical_address")"
              canonical_id="$(printf '%s\n' "$canonical_values" | sed -n 's/^ *id *= *"\([^"]*\)".*/\1/p' | head -n 1)"
              if [ -z "$legacy_id" ] || [ "$legacy_id" != "$canonical_id" ]; then
                echo "Refusing to remove $legacy_address because its remote ID differs from $canonical_address." >&2
                exit 1
              fi
              echo "Removing duplicate state reference $legacy_address; Databricks permission is unchanged."
              terraform -chdir="$TF_WORKDIR" state rm "$legacy_address"
            else
              echo "Moving $legacy_address to $canonical_address; Databricks permission is unchanged."
              terraform -chdir="$TF_WORKDIR" state mv "$legacy_address" "$canonical_address"
            fi
          done < <(
            terraform -chdir="$TF_WORKDIR" state list |
              grep -E '^module\.schema_creation\["[^"]+"\]\.databricks_grant\.communitymart_ad_group_catalog\[0\]$' || true
          )

      - name: Migrate schema resources to stable target keys
        run: |
          python uda/scripts/schema-creation/migrate_schema_state_keys.py \
            --state-addresses-file "$OUTPUT_DIR/schema-state-addresses.txt" \
            --tfvars-json "$TFVARS_JSON" \
            --output-file "$TF_WORKDIR/generated-schema-moves.tf"

      - name: Terraform plan
        run: |
          terraform -chdir="$TF_WORKDIR" plan \
            -lock-timeout=10m \
            -var-file="$GITHUB_WORKSPACE/$TFVARS_JSON" \
            -out="$GITHUB_WORKSPACE/$TFPLAN_BIN"

          terraform -chdir="$TF_WORKDIR" show -no-color "$GITHUB_WORKSPACE/$TFPLAN_BIN" > "$TFPLAN_TXT"

      - name: Enforce create-or-update-only plan
        shell: bash
        run: |
          PLAN_JSON="$OUTPUT_DIR/schema-creation-plan.json"
          terraform -chdir="$TF_WORKDIR" show -json "$GITHUB_WORKSPACE/$TFPLAN_BIN" > "$PLAN_JSON"

          removal_count="$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length' "$PLAN_JSON")"
          echo "Plan removal/replacement action count: $removal_count"

          if [ "$removal_count" -gt 0 ]; then
            echo "Plan rejected: schema creation supports create and in-place update actions only." >&2
            exit 1
          fi

      - name: Terraform apply
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_plan && inputs.run_apply) }}
        run: |
          terraform -chdir="$TF_WORKDIR" apply -lock-timeout=10m -auto-approve "$GITHUB_WORKSPACE/$TFPLAN_BIN"

      - name: Publish plan outputs
        if: ${{ always() && steps.prep_paths.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uda-dbx-schema-creation-plan-output-${{ steps.prep_paths.outputs.request_id }}
          path: ${{ steps.prep_paths.outputs.output_dir }}
          if-no-files-found: warn

      - name: Write plan summary
        if: always()
        run: |
          {
            echo "## Schema Creation Plan Result"
            echo "- Request file: $REQUEST_FILE"
            echo "- Output dir: $OUTPUT_DIR"
            echo "- Plan text: $TFPLAN_TXT"
            echo "- Backend key: $TF_BACKEND_KEY"
          } >> "$GITHUB_STEP_SUMMARY"

  post-validate-schema-creation:
    needs: [detect-requests, plan-schema-creation]
    if: ${{ needs.plan-schema-creation.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_plan && inputs.run_apply)) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect-requests.outputs.matrix) }}

    env:
      REQUEST_FILE: ${{ matrix.request_file }}
      OUTPUT_ROOT: uda/output/schema-creation
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Azure and Databricks
        uses: ./.github/workflows/setup-dbxtf-env
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ secrets.KEYVAULT_NAME }}
          tfstate_key_suffix: schema-creation

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install workflow dependencies
        run: |
          pip install --only-binary=:all: pyyaml==6.0.2 requests==2.32.3

      - name: Prepare post-validation path
        id: post_paths
        shell: bash
        run: |
          request_name="$(basename "$REQUEST_FILE")"
          request_id="${request_name%.*}"
          output_dir="$OUTPUT_ROOT/$request_id"
          mkdir -p "$output_dir"
          echo "REQUEST_ID=$request_id" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"
          echo "NORMALIZED_JSON=$output_dir/$request_id.normalized.json" >> "$GITHUB_ENV"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Download plan artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: uda-dbx-schema-creation-plan-output-${{ steps.post_paths.outputs.request_id }}
          path: ${{ steps.post_paths.outputs.output_dir }}

      - name: Normalize request for live validation
        run: |
          python uda/scripts/schema-creation/normalize_request.py \
            --request-file "$REQUEST_FILE" \
            --output-json "$NORMALIZED_JSON"

      - name: Validate live Databricks schema state
        shell: bash
        run: |
          python "$GITHUB_WORKSPACE/uda/scripts/schema-creation/validate_live_schema.py" \
            --request-json "$NORMALIZED_JSON" \
            --databricks-host "$DATABRICKS_HOST" \
            --output-json "$OUTPUT_DIR/schema-creation-status.json"

      - name: Publish validation outputs
        if: ${{ always() && steps.post_paths.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uda-dbx-schema-creation-validation-${{ steps.post_paths.outputs.request_id }}
          path: ${{ steps.post_paths.outputs.output_dir }}
          if-no-files-found: warn

      - name: Write validation summary
        if: always()
        run: |
          {
            echo "## Post Validation Result"
            echo "- Request file: $REQUEST_FILE"
            echo "- Output dir: $OUTPUT_DIR"
            echo "- Host: $DATABRICKS_HOST"
          } >> "$GITHUB_STEP_SUMMARY"

