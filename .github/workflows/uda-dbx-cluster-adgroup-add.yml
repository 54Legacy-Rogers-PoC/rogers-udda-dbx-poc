name: DDD-DBX-04 UDA Databricks Cluster AD Group ADD

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: Path to the Request-as-Code YAML
        required: true
        default: uda/requests/cluster-adgroup-add/dev/RITMDEVAG0001.yaml
        type: string
      auto_apply:
        description: Run terraform apply after successful plan
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate_request:
    name: Stage 1-2 Request Validation
    runs-on: ubuntu-latest
    outputs:
      request_file: ${{ steps.request_input.outputs.request_file }}
      request_id: ${{ steps.read_metadata.outputs.request_id }}
      environment: ${{ steps.read_metadata.outputs.environment }}
      activity_type: ${{ steps.read_metadata.outputs.activity_type }}
      cluster_name: ${{ steps.read_metadata.outputs.cluster_name }}
      ad_group_name: ${{ steps.read_metadata.outputs.ad_group_name }}
      cluster_id: ${{ steps.read_metadata.outputs.cluster_id }}
      cluster_permission_level: ${{ steps.read_metadata.outputs.cluster_permission_level }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r uda/scripts/requirements.txt

      - name: Process cluster AD group request artifact
        run: |
          python uda/scripts/process_cluster_adgroup_request.py \
            --request-file "${{ github.event.inputs.request_file || 'uda/requests/cluster-adgroup-add/dev/RITMDEVAG0001.yaml' }}" \
            --config-file "uda/config/environments.yaml" \
            --output-dir "generated"

      - name: Resolve request file path
        id: request_input
        run: echo "request_file=${{ github.event.inputs.request_file || 'uda/requests/cluster-adgroup-add/dev/RITMDEVAG0001.yaml' }}" >> "$GITHUB_OUTPUT"

      - name: Read request metadata
        id: read_metadata
        run: |
          echo "request_id=$(jq -r .request_id generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "environment=$(jq -r .environment generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "activity_type=$(jq -r .activity_type generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$(jq -r .cluster_name generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "ad_group_name=$(jq -r .ad_group_name generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "cluster_id=$(jq -r .cluster_id generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "cluster_permission_level=$(jq -r .cluster_permission_level generated/request_metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Enforce ADD activity for this workflow
        run: |
          ACTIVITY_TYPE=$(jq -r .activity_type generated/request_metadata.json)
          if [ "$ACTIVITY_TYPE" != "ADD" ]; then
            echo "ERROR: This workflow only supports activity_type=ADD. Use uda-dbx-cluster-adgroup-remove.yml for REMOVE requests."
            exit 1
          fi

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uda-cluster-adgroup-generated
          path: |
            generated/terraform.auto.tfvars.json
            generated/request_metadata.json
            generated/execution_log.json

  terraform_plan:
    name: Stage 3 Terraform Plan
    runs-on: ubuntu-latest
    needs:
      - validate_request
    outputs:
      tf_plan_status: ${{ steps.plan_status.outputs.tf_plan_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-cluster-adgroup-generated
          path: generated

      - name: Setup Azure + KeyVault + Terraform backend
        uses: ./.github/actions/setup-dbxtf-env
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ secrets.KEYVAULT_NAME }}
          tfstate_key_suffix: cluster-adgroup

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var-file="../generated/terraform.auto.tfvars.json" \
            -out="tfplan.binary"
          terraform show -no-color tfplan.binary > tfplan.txt

      - name: Set plan status
        id: plan_status
        run: echo "tf_plan_status=success" >> "$GITHUB_OUTPUT"

      - name: Upload terraform plan output
        uses: actions/upload-artifact@v4
        with:
          name: uda-cluster-adgroup-terraform-plan
          path: |
            terraform/tfplan.binary
            terraform/tfplan.txt

  terraform_apply:
    name: Stage 4 Terraform Apply
    runs-on: ubuntu-latest
    needs:
      - validate_request
      - terraform_plan
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto_apply == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-cluster-adgroup-generated
          path: generated

      - name: Download terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          name: uda-cluster-adgroup-terraform-plan
          path: terraform

      - name: Setup Azure + KeyVault + Terraform backend
        uses: ./.github/actions/setup-dbxtf-env
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ secrets.KEYVAULT_NAME }}
          tfstate_key_suffix: cluster-adgroup

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan.binary

  notification:
    name: Stage 5 Notification and Summary
    runs-on: ubuntu-latest
    needs:
      - validate_request
      - terraform_plan
      - terraform_apply
    if: always()
    steps:
      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-cluster-adgroup-generated
          path: generated

      - name: Publish workflow summary
        run: |
          {
            echo "## Databricks Cluster AD Group ADD Execution Summary"
            echo ""
            echo "- Request File: ${{ needs.validate_request.outputs.request_file }}"
            echo "- Request ID: ${{ needs.validate_request.outputs.request_id }}"
            echo "- Environment: ${{ needs.validate_request.outputs.environment }}"
            echo "- Activity Type: ${{ needs.validate_request.outputs.activity_type }}"
            echo "- Cluster Name: ${{ needs.validate_request.outputs.cluster_name }}"
            echo "- Cluster ID: ${{ needs.validate_request.outputs.cluster_id }}"
            echo "- AD Group Name: ${{ needs.validate_request.outputs.ad_group_name }}"
            echo "- Permission Level: ${{ needs.validate_request.outputs.cluster_permission_level }}"
            echo "- Plan Status: ${{ needs.terraform_plan.outputs.tf_plan_status }}"
            echo "- Apply Executed: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto_apply == 'true' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Determine notification configuration
        id: notify_config
        env:
          NOTIFY_SMTP_SERVER: ${{ secrets.NOTIFY_SMTP_SERVER }}
          NOTIFY_SMTP_PORT: ${{ secrets.NOTIFY_SMTP_PORT }}
          NOTIFY_SMTP_USERNAME: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          NOTIFY_SMTP_PASSWORD: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          NOTIFY_FROM_EMAIL: ${{ secrets.NOTIFY_FROM_EMAIL }}
          NOTIFY_DL_EMAIL: ${{ secrets.NOTIFY_DL_EMAIL }}
        run: |
          set -euo pipefail
          if [ -n "$NOTIFY_SMTP_SERVER" ] && [ -n "$NOTIFY_SMTP_PORT" ] && [ -n "$NOTIFY_SMTP_USERNAME" ] && [ -n "$NOTIFY_SMTP_PASSWORD" ] && [ -n "$NOTIFY_FROM_EMAIL" ] && [ -n "$NOTIFY_DL_EMAIL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send completion email to distribution list
        if: ${{ steps.notify_config.outputs.enabled == 'true' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.NOTIFY_SMTP_SERVER }}
          server_port: ${{ secrets.NOTIFY_SMTP_PORT }}
          username: ${{ secrets.NOTIFY_SMTP_USERNAME }}
          password: ${{ secrets.NOTIFY_SMTP_PASSWORD }}
          subject: "UDA Databricks Cluster AD Group ADD Completed - ${{ needs.validate_request.outputs.request_id }}"
          to: ${{ secrets.NOTIFY_DL_EMAIL }}
          from: ${{ secrets.NOTIFY_FROM_EMAIL }}
          body: |
            UDA Databricks Cluster AD Group ADD workflow completed.

            Request ID: ${{ needs.validate_request.outputs.request_id }}
            Request File: ${{ needs.validate_request.outputs.request_file }}
            Environment: ${{ needs.validate_request.outputs.environment }}
            Activity Type: ${{ needs.validate_request.outputs.activity_type }}
            Cluster Name: ${{ needs.validate_request.outputs.cluster_name }}
            Cluster ID: ${{ needs.validate_request.outputs.cluster_id }}
            AD Group Name: ${{ needs.validate_request.outputs.ad_group_name }}
            Permission Level: ${{ needs.validate_request.outputs.cluster_permission_level }}
            Plan Status: ${{ needs.terraform_plan.outputs.tf_plan_status }}
            Apply Executed: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto_apply == 'true' }}
            Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Add notification status to summary
        run: |
          if [ "${{ steps.notify_config.outputs.enabled }}" = "true" ]; then
            echo "- Notification DL Email: sent to configured distribution list" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Notification DL Email: skipped (missing notification secrets)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Archive execution log
        uses: actions/upload-artifact@v4
        with:
          name: uda-cluster-adgroup-execution-log
          path: generated/execution_log.json
