name: UDA Databricks Cluster AD Group ADD

on:
  workflow_dispatch:
    inputs:
      request_file:
        description: Path to the Request-as-Code YAML
        required: true
        default: requests/cluster-adgroup-add/dev/RITMDEVAG0001.yaml
        type: string
      auto_apply:
        description: Run terraform apply after successful plan
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  validate_request:
    name: Stage 1-2 Request Validation
    runs-on: ubuntu-latest
    outputs:
      request_file: ${{ steps.request_input.outputs.request_file }}
      request_id: ${{ steps.read_metadata.outputs.request_id }}
      environment: ${{ steps.read_metadata.outputs.environment }}
      activity_type: ${{ steps.read_metadata.outputs.activity_type }}
      cluster_name: ${{ steps.read_metadata.outputs.cluster_name }}
      ad_group_name: ${{ steps.read_metadata.outputs.ad_group_name }}
      cluster_id: ${{ steps.read_metadata.outputs.cluster_id }}
      cluster_permission_level: ${{ steps.read_metadata.outputs.cluster_permission_level }}
      keyvault_name: ${{ steps.environment_config.outputs.keyvault_name }}
      databricks_host_secret_name: ${{ steps.environment_config.outputs.databricks_host_secret_name }}
      databricks_client_id_secret_name: ${{ steps.environment_config.outputs.databricks_client_id_secret_name }}
      databricks_client_secret_secret_name: ${{ steps.environment_config.outputs.databricks_client_secret_secret_name }}
      databricks_tenant_id_secret_name: ${{ steps.environment_config.outputs.databricks_tenant_id_secret_name }}
      databricks_workspace_resource_id_secret_name: ${{ steps.environment_config.outputs.databricks_workspace_resource_id_secret_name }}
      tfstate_resource_group_secret_name: ${{ steps.environment_config.outputs.tfstate_resource_group_secret_name }}
      tfstate_storage_account_secret_name: ${{ steps.environment_config.outputs.tfstate_storage_account_secret_name }}
      tfstate_container_secret_name: ${{ steps.environment_config.outputs.tfstate_container_secret_name }}
      tfstate_key_secret_name: ${{ steps.environment_config.outputs.tfstate_key_secret_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r uda/scripts/requirements.txt

      - name: Process cluster AD group request artifact
        run: |
          python uda/scripts/cluster-adgroup/process_cluster_adgroup_request.py \
            --request-file "${{ github.event.inputs.request_file || 'requests/cluster-adgroup-add/dev/RITMDEVAG0001.yaml' }}" \
            --config-file "uda/config/environments.yaml" \
            --output-dir "generated"

      - name: Resolve request file path
        id: request_input
        run: echo "request_file=${{ github.event.inputs.request_file || 'requests/cluster-adgroup-add/dev/RITMDEVAG0001.yaml' }}" >> "$GITHUB_OUTPUT"

      - name: Read request metadata
        id: read_metadata
        run: |
          echo "request_id=$(jq -r .request_id generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "environment=$(jq -r .environment generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "activity_type=$(jq -r .activity_type generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "cluster_name=$(jq -r .cluster_name generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "ad_group_name=$(jq -r .ad_group_name generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "cluster_id=$(jq -r .cluster_id generated/request_metadata.json)" >> "$GITHUB_OUTPUT"
          echo "cluster_permission_level=$(jq -r .cluster_permission_level generated/request_metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Resolve environment configuration
        id: environment_config
        run: |
          python uda/scripts/resolve_environment_config.py \
            --request-json generated/request_metadata.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Enforce ADD activity for this workflow
        run: |
          ACTIVITY_TYPE=$(jq -r .activity_type generated/request_metadata.json)
          if [ "$ACTIVITY_TYPE" != "ADD" ]; then
            echo "ERROR: This workflow only supports activity_type=ADD. Use uda-dbx-cluster-adgroup-remove.yml for REMOVE requests."
            exit 1
          fi

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uda-cluster-adgroup-generated
          path: |
            generated/terraform.auto.tfvars.json
            generated/request_metadata.json
            generated/execution_log.json

  terraform_validation:
    name: Stage 3 Terraform Validation
    needs:
      - validate_request
    uses: 54Legacy-Rogers-PoC/54legacy-Resusable-Workflows/.github/workflows/platform-terraform-validation.yml@main
    with:
      working-directory: terraform/environments/dev
      terraform-version: "1.9.8"
      fmt-recursive: true

  terraform_plan:
    name: Stage 4 Terraform Plan
    needs:
      - validate_request
      - terraform_validation
    uses: 54Legacy-Rogers-PoC/54legacy-Resusable-Workflows/.github/workflows/platform-terraform-plan.yml@ba1cb62f63fafd15a83708e41d4915b2dd2297b8
    with:
      working-directory: terraform/environments/dev
      terraform-version: "1.9.8"
      generated-artifact: uda-cluster-adgroup-generated
      generated-path: generated
      databricks-setup: true
      environment-config-json: ${{ toJSON(needs.validate_request.outputs) }}
      tfstate-key-suffix: cluster-adgroup
      var-file: -var-file="../../../generated/terraform.auto.tfvars.json"
      artifact-name: uda-cluster-adgroup-terraform-plan
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  terraform_apply:
    name: Stage 4 Terraform Apply
    runs-on: ubuntu-latest
    needs:
      - validate_request
      - terraform_plan
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto_apply == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-cluster-adgroup-generated
          path: generated

      - name: Download terraform plan artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.terraform_plan.outputs.plan-artifact }}
          path: terraform/environments/dev

      - name: Setup Azure + KeyVault + Terraform backend
        uses: ./.github/workflows/setup-dbxtf-env
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ needs.validate_request.outputs.keyvault_name }}
          databricks_host_secret_name: ${{ needs.validate_request.outputs.databricks_host_secret_name }}
          databricks_client_id_secret_name: ${{ needs.validate_request.outputs.databricks_client_id_secret_name }}
          databricks_client_secret_secret_name: ${{ needs.validate_request.outputs.databricks_client_secret_secret_name }}
          databricks_tenant_id_secret_name: ${{ needs.validate_request.outputs.databricks_tenant_id_secret_name }}
          databricks_workspace_resource_id_secret_name: ${{ needs.validate_request.outputs.databricks_workspace_resource_id_secret_name }}
          tfstate_resource_group_secret_name: ${{ needs.validate_request.outputs.tfstate_resource_group_secret_name }}
          tfstate_storage_account_secret_name: ${{ needs.validate_request.outputs.tfstate_storage_account_secret_name }}
          tfstate_container_secret_name: ${{ needs.validate_request.outputs.tfstate_container_secret_name }}
          tfstate_key_secret_name: ${{ needs.validate_request.outputs.tfstate_key_secret_name }}
          tfstate_key_suffix: cluster-adgroup

      - name: Terraform apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve tfplan

  post_validate_cluster_access:
    name: Stage 5 Post Validation
    runs-on: ubuntu-latest
    needs:
      - validate_request
      - terraform_plan
      - terraform_apply
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto_apply == 'true' && needs.terraform_apply.result == 'success' }}
    outputs:
      validation_status: ${{ steps.post_validation.outputs.validation_status }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: requests==2.32.3

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-cluster-adgroup-generated
          path: generated

      - name: Setup Azure + KeyVault + Terraform backend
        uses: ./.github/workflows/setup-dbxtf-env
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ needs.validate_request.outputs.keyvault_name }}
          databricks_host_secret_name: ${{ needs.validate_request.outputs.databricks_host_secret_name }}
          databricks_client_id_secret_name: ${{ needs.validate_request.outputs.databricks_client_id_secret_name }}
          databricks_client_secret_secret_name: ${{ needs.validate_request.outputs.databricks_client_secret_secret_name }}
          databricks_tenant_id_secret_name: ${{ needs.validate_request.outputs.databricks_tenant_id_secret_name }}
          databricks_workspace_resource_id_secret_name: ${{ needs.validate_request.outputs.databricks_workspace_resource_id_secret_name }}
          tfstate_resource_group_secret_name: ${{ needs.validate_request.outputs.tfstate_resource_group_secret_name }}
          tfstate_storage_account_secret_name: ${{ needs.validate_request.outputs.tfstate_storage_account_secret_name }}
          tfstate_container_secret_name: ${{ needs.validate_request.outputs.tfstate_container_secret_name }}
          tfstate_key_secret_name: ${{ needs.validate_request.outputs.tfstate_key_secret_name }}
          tfstate_key_suffix: cluster-adgroup

      - name: Validate live Databricks cluster access
        id: validate_live_access
        run: |
          python uda/scripts/cluster-adgroup/validate_live_access.py \
            --request-metadata-json generated/request_metadata.json \
            --databricks-host "$TF_VAR_databricks_host"

      - name: Record post-validation status
        id: post_validation
        run: echo "validation_status=success" >> "$GITHUB_OUTPUT"

      - name: Write post-validation summary
        if: always()
        run: |
          {
            echo "## Databricks Cluster AD Group Post Validation"
            echo ""
            echo "- Request ID: ${{ needs.validate_request.outputs.request_id }}"
            echo "- Cluster Name: ${{ needs.validate_request.outputs.cluster_name }}"
            echo "- Cluster ID: ${{ needs.validate_request.outputs.cluster_id }}"
            echo "- AD Group Name: ${{ needs.validate_request.outputs.ad_group_name }}"
            echo "- Permission Level: ${{ needs.validate_request.outputs.cluster_permission_level }}"
            echo "- Validation Status: ${{ steps.validate_live_access.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

  notification:
    name: Stage 6 Notification and Summary
    runs-on: ubuntu-latest
    needs:
      - validate_request
      - terraform_validation
      - terraform_plan
      - terraform_apply
      - post_validate_cluster_access
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: uda-cluster-adgroup-generated
          path: generated

      - name: Publish workflow summary
        run: |
          {
            echo "## Databricks Cluster AD Group ADD Execution Summary"
            echo ""
            echo "- Request File: ${{ needs.validate_request.outputs.request_file }}"
            echo "- Request ID: ${{ needs.validate_request.outputs.request_id }}"
            echo "- Environment: ${{ needs.validate_request.outputs.environment }}"
            echo "- Activity Type: ${{ needs.validate_request.outputs.activity_type }}"
            echo "- Cluster Name: ${{ needs.validate_request.outputs.cluster_name }}"
            echo "- Cluster ID: ${{ needs.validate_request.outputs.cluster_id }}"
            echo "- AD Group Name: ${{ needs.validate_request.outputs.ad_group_name }}"
            echo "- Permission Level: ${{ needs.validate_request.outputs.cluster_permission_level }}"
            echo "- Terraform Validation Status: ${{ needs.terraform_validation.result }}"
            echo "- Plan Status: ${{ needs.terraform_plan.outputs.result }}"
            echo "- Apply Executed: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto_apply == 'true' }}"
            echo "- Post Validation Status: ${{ needs.post_validate_cluster_access.result || 'not_run' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send completion notification
        id: notify
        uses: ./.github/workflows/send-dl-notification
        with:
          azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
          azure_client_secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          keyvault_name: ${{ needs.validate_request.outputs.keyvault_name }}
          subject: "UDA Databricks Cluster AD Group ADD Completed - ${{ needs.validate_request.outputs.request_id }}"
          body: |
            UDA Databricks Cluster AD Group ADD workflow completed.

            Request ID: ${{ needs.validate_request.outputs.request_id }}
            Request File: ${{ needs.validate_request.outputs.request_file }}
            Environment: ${{ needs.validate_request.outputs.environment }}
            Activity Type: ${{ needs.validate_request.outputs.activity_type }}
            Cluster Name: ${{ needs.validate_request.outputs.cluster_name }}
            Cluster ID: ${{ needs.validate_request.outputs.cluster_id }}
            AD Group Name: ${{ needs.validate_request.outputs.ad_group_name }}
            Permission Level: ${{ needs.validate_request.outputs.cluster_permission_level }}
            Terraform Validation Status: ${{ needs.terraform_validation.result }}
            Plan Status: ${{ needs.terraform_plan.outputs.result }}
            Apply Executed: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto_apply == 'true' }}
            Post Validation Status: ${{ needs.post_validate_cluster_access.result || 'not_run' }}
            Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Add notification status to summary
        run: |
          if [ "${{ steps.notify.outputs.status }}" = "sent" ]; then
            echo "- Notification DL Email: sent from Key Vault to configured distribution list" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Notification DL Email: skipped (missing Key Vault notification secrets)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Archive execution log
        uses: actions/upload-artifact@v4
        with:
          name: uda-cluster-adgroup-execution-log
          path: generated/execution_log.json
